<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" font-family="system-ui, sans-serif"><title>Recap entry point and flow (computer, 1366)</title><rect width="1366" height="768" fill="#0b0d1f"/><rect x="0" y="0" width="1366" height="52" rx="0" fill="#0e1029" stroke="#2c3170" stroke-width="1"/><g transform="translate(16 12) scale(0.44)"><rect width="64" height="64" rx="16" fill="#22174f"/><path d="M29 27 L64 8 L64 56 L29 37 Z" fill="#ffc65a" opacity=".75"/><path d="M12 20 L31 32 L12 44 Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><ellipse cx="44" cy="32" rx="2.6" ry="3.6" fill="#140d33"/><ellipse cx="53" cy="32" rx="2.6" ry="3.6" fill="#140d33"/></g><text x="52" y="32" font-size="15" font-weight="700" fill="#f1eefc">Sidelit</text><rect x="1106" y="10" width="92" height="32" rx="10" fill="#8b6cff" stroke="#8b6cff" stroke-width="1"/><text x="1152" y="30.68" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">🔗 Invite</text><rect x="1216" y="10" width="34" height="32" rx="10" fill="#15183a" stroke="#2c3170" stroke-width="1"/><text x="1233" y="31" font-size="13" fill="#f1eefc" text-anchor="middle">⋯</text><circle cx="1286" cy="26" r="15" fill="#1d2150" stroke="#8b6cff"/><rect x="24" y="68" width="900" height="506" rx="14" fill="#05060f" stroke="#2c3170" stroke-width="1"/><path d="M452 293 l50 28 l-50 28 z" fill="#2c3170"/><text x="474" y="373" font-size="13" fill="#b9b4d8" text-anchor="middle"></text><rect x="936" y="68" width="54" height="506" rx="14" fill="#15183a" stroke="#2c3170" stroke-width="1"/><rect x="942" y="80" width="42" height="42" rx="10" fill="#1d2150" stroke="#2c3170" stroke-width="1"/><text x="963" y="106.76" font-size="16" font-weight="600" fill="#f1eefc" text-anchor="middle">💬</text><rect x="942" y="130" width="42" height="42" rx="10" fill="#1d2150" stroke="#2c3170" stroke-width="1"/><text x="963" y="156.76" font-size="16" font-weight="600" fill="#f1eefc" text-anchor="middle">😀</text><rect x="942" y="180" width="42" height="42" rx="10" fill="#1d2150" stroke="#2c3170" stroke-width="1"/><text x="963" y="206.76" font-size="16" font-weight="600" fill="#f1eefc" text-anchor="middle">🎙</text><rect x="942" y="230" width="42" height="42" rx="10" fill="#1d2150" stroke="#2c3170" stroke-width="1"/><text x="963" y="256.76" font-size="16" font-weight="600" fill="#f1eefc" text-anchor="middle">＋</text><rect x="942" y="280" width="42" height="42" rx="10" fill="#1d2150" stroke="#2c3170" stroke-width="1"/><text x="963" y="306.76" font-size="16" font-weight="600" fill="#f1eefc" text-anchor="middle">🎮</text><rect x="942" y="340" width="42" height="42" rx="10" fill="#3a2a10" stroke="#ffc65a" stroke-width="2"/><text x="963" y="367" font-size="17" fill="#f1eefc" text-anchor="middle">✨</text><circle cx="980" cy="344" r="5" fill="#ffc65a"/><circle cx="1004" cy="362" r="11" fill="#ffc65a"/><text x="1004" y="366.5" font-size="12" font-weight="800" fill="#140d33" text-anchor="middle">1</text><rect x="300" y="220" width="350" height="200" rx="16" fill="#15183a" stroke="#8b6cff" stroke-width="1"/><text x="475" y="256" font-size="16" font-weight="800" fill="#f1eefc" text-anchor="middle">Video ended</text><text x="475" y="280" font-size="12.5" fill="#b9b4d8" text-anchor="middle">Nothing else in the queue</text><rect x="320" y="300" width="310" height="44" rx="10" fill="#8b6cff" stroke="#8b6cff" stroke-width="1"/><text x="475" y="326.86" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">✨ Show tonight’s recap to everyone</text><rect x="320" y="354" width="150" height="40" rx="10" fill="#1d2150" stroke="#2c3170" stroke-width="1"/><text x="395" y="378.68" font-size="13" font-weight="600" fill="#f1eefc" text-anchor="middle">▶ Play next</text><rect x="480" y="354" width="150" height="40" rx="10" fill="#1d2150" stroke="#2c3170" stroke-width="1"/><text x="555" y="378.68" font-size="13" font-weight="600" fill="#f1eefc" text-anchor="middle">Close</text><circle cx="290" cy="230" r="11" fill="#ffc65a"/><text x="290" y="234.5" font-size="12" font-weight="800" fill="#140d33" text-anchor="middle">2</text><rect x="1000" y="80" width="350" height="96" rx="14" fill="#1d2150" stroke="#8b6cff" stroke-width="1"/><text x="1016" y="106" font-size="11" fill="#b9b4d8">Guest’s ✨ menu</text><text x="1016" y="128" font-size="13" font-weight="700" fill="#f1eefc">✨ The recap is ready (1 h 40 min)</text><rect x="1016" y="138" width="200" height="30" rx="10" fill="#1d2150" stroke="#2c3170" stroke-width="1"/><text x="1116" y="157.32" font-size="12" font-weight="600" fill="#f1eefc" text-anchor="middle">🙋 Ask the host to show it</text><circle cx="1360" cy="90" r="11" fill="#ffc65a"/><text x="1360" y="94.5" font-size="12" font-weight="800" fill="#140d33" text-anchor="middle">3</text><rect x="1000" y="196" width="350" height="108" rx="14" fill="#1d2150" stroke="#ffc65a" stroke-width="1.5"/><text x="1016" y="222" font-size="11" fill="#b9b4d8">Host’s screen</text><text x="1016" y="244" font-size="13" font-weight="700" fill="#f1eefc">🙋 Sam asks to see the recap</text><rect x="1016" y="258" width="160" height="34" rx="10" fill="#8b6cff" stroke="#8b6cff" stroke-width="1"/><text x="1096" y="279.32" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">✨ Show to everyone</text><rect x="1186" y="258" width="100" height="34" rx="10" fill="#1d2150" stroke="#2c3170" stroke-width="1"/><text x="1236" y="279.32" font-size="12" font-weight="600" fill="#f1eefc" text-anchor="middle">Not now</text><circle cx="1360" cy="206" r="11" fill="#ffc65a"/><text x="1360" y="210.5" font-size="12" font-weight="800" fill="#140d33" text-anchor="middle">4</text><rect x="24" y="590" width="900" height="44" rx="12" fill="#1a1530" stroke="#ffc65a" stroke-width="1" opacity="0.95"/><g transform="translate(30 588) scale(0.7)"><circle cx="40" cy="32" r="23" fill="#ffc65a" opacity=".25"/><path d="M5 32 L28 17.5 A17 17 0 1 1 28 46.5 Z" fill="#ffc65a" stroke="#ffc65a" stroke-width="2" stroke-linejoin="round"/><ellipse cx="38" cy="30" rx="2.8" ry="3.9" fill="#1a1036"/><ellipse cx="47" cy="30" rx="2.8" ry="3.9" fill="#1a1036"/><path d="M38.5 37.5 Q42.5 42 46.5 37.5" stroke="#1a1036" stroke-width="1.6" fill="none" stroke-linecap="round"/></g><text x="84" y="618" font-size="13" fill="#f1eefc">Long night! The recap of these 3 h 12 min is ready under ✨ whenever you like.</text><text x="910" y="618" font-size="14" fill="#b9b4d8" text-anchor="end">✕</text><circle cx="14" cy="600" r="11" fill="#ffc65a"/><text x="14" y="604.5" font-size="12" font-weight="800" fill="#140d33" text-anchor="middle">5</text><text x="24" y="664" font-size="12" fill="#ffc65a">① ✨ appears on the rail / top bar only once the session is eligible (≥ 30 min, ≥ 2 people). A gold dot until someone opened it.</text><text x="24" y="684" font-size="12" fill="#ffc65a">② The natural end: the queue ran out. The host gets the button on the end card; guests get “🙋 Ask the host”.</text><text x="24" y="704" font-size="12" fill="#ffc65a">③ ④ Guests ask (once per 10 min each); the host gets one toast with the names collected, never a popup.</text><text x="24" y="724" font-size="12" fill="#ffc65a">⑤ At most one quiet line per session, never after the recap was shown, never for people who said “✕ don’t remind me”.</text></svg>
