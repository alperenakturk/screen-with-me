<ellipse cx="19.5" cy="44" rx="2.2" ry="1.32" fill="#ff8f6a" opacity=".45"/><ellipse cx="42" cy="44" rx="2.2" ry="1.32" fill="#ff8f6a" opacity=".45"/></svg></svg>
