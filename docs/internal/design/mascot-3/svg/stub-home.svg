</g>
<path d="M9 34 L4 40" stroke="#9a4f16" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M56 30 L58.5 29" stroke="#9a4f16" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(-8 60 29)"><rect x="56.5" y="27" width="5.4" height="4.2" rx="1" fill="#3a2d6e" stroke="#9a4f16" stroke-width=".8"/><path d="M61.9 26.4 L64 25.4 V32.8 L61.9 31.8Z" fill="#fff3d6"/></g><path d="M24 50 L23 58" stroke="#9a4f16" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 49 L39 57" stroke="#9a4f16" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></svg>
