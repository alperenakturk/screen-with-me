<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScreenWithMe · Mikrofon</title>
    <style>
      :root {
        color-scheme: dark;
      }
      /* 0.9.91.11 (owner): Chrome's question opens at the window's top left and covered this text. The window is
         wide: the left side is kept free for Chrome's question (an arrow points at it), our text sits on the right. */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(350px, 1fr) minmax(0, 420px);
        align-items: center;
        background: radial-gradient(ellipse 70% 45% at 50% -5%, rgb(139 108 255 / 0.24), transparent 70%), linear-gradient(#171c40, #0c0e1e 60%);
        color: #eef0ff;
        font: 16px/1.5 system-ui, sans-serif;
      }
      .ask {
        align-self: start;
        margin: 10px 0 0 18px;
        max-width: 300px;
        color: #c9bcff;
        font: 600 15px/1.45 system-ui, sans-serif;
      }
      .ask b {
        display: block;
        font-size: 30px;
        line-height: 1;
        margin-bottom: 6px;
      }
      main {
        max-width: 460px;
        margin: 16px;
        padding: 28px;
        border-radius: 18px;
        background: rgb(255 255 255 / 0.06);
        border: 1px solid rgb(255 255 255 / 0.12);
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        font-size: 22px;
        margin: 12px 0 6px;
      }
      p {
        color: #c5c8e8;
        margin: 8px 0;
      }
      button {
        margin-top: 14px;
        font: 700 17px system-ui, sans-serif;
        color: #fff;
        background: #7c5cff;
        border: 0;
        border-radius: 12px;
        padding: 13px 26px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
      }
      .error {
        color: #ff9b9b;
      }
    </style>
  </head>
  <body>
    <p class="ask" id="ask" aria-hidden="true"><b>↖</b><span id="ask-text"></span></p>
    <main>
      <img src="icon128.png" alt="" />
      <h1 id="title"></h1>
      <p id="text"></p>
      <button id="allow" type="button"></button>
      <p id="status" class="error" hidden></p>
    </main>
    <script type="module" src="mic.js"></script>
  </body>
</html>
