<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>ScreenWithMe</title>
    <style>
      /* Sitemizle aynı renk şeması: farklı olursa Chrome iç çerçevenin arkasını opak boyar (saydamlık gider) */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      /* Site yüklenene kadar film sayfası görünmesin: oda görünümü hemen gelsin (sitenin "Gece" zemini) */
      html:not(.ready) {
        background: linear-gradient(#171c40, #0c0e1e 60%);
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script type="module" src="shell.js"></script>
  </body>
</html>
