<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>ScreenWithMe · Bağlantı yok</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse 70% 45% at 50% -5%, rgb(139 108 255 / 0.24), transparent 70%), linear-gradient(#171c40, #0c0e1e 60%);
        color: #eceefa;
        font: 16px/1.5 system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 420px;
        margin: 16px;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 22px;
        margin: 14px 0 6px;
      }
      p {
        color: #c5c8e8;
        margin: 6px 0;
      }
      button {
        margin-top: 16px;
        font: 700 16px system-ui, sans-serif;
        color: #fff;
        background: #6a4cf2;
        border: 0;
        border-radius: 12px;
        padding: 12px 24px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="" />
      <h1 id="title">İnternet bağlantısı yok</h1>
      <p id="text">ScreenWithMe internet olmadan çalışmıyor. Bağlantın gelince tekrar dene.</p>
      <button id="retry" type="button">Tekrar dene</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
