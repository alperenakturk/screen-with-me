<!doctype html>
<!--
  Mağaza ekran görüntüleri. Eklentinin gerçek stillerini (overlay.ts CSS'i ve
  popup.css) taklit eder; "video" çizilmiş bir manzara (telifli görüntü yok).
  scripts/store-shots.mjs bunu ?shot=1|2|3|promo ile headless Chrome'da açıp PNG yapar.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { width: 1280px; height: 800px; overflow: hidden; color: #ecedf1;
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 20% 0%, #2a1f5c 0%, #0f1014 60%); }
      .headline { position: absolute; left: 0; right: 0; top: 34px; text-align: center; }
      .headline h1 { margin: 0; font-size: 40px; letter-spacing: -0.5px; }
      .headline p { margin: 6px 0 0; font-size: 19px; color: #b9bccb; }

      /* Tarayıcı penceresi taklidi */
      .window { position: absolute; left: 90px; right: 90px; top: 160px; bottom: -20px; border-radius: 14px 14px 0 0;
        background: #1d2027; border: 1px solid #343846; box-shadow: 0 30px 80px rgb(0 0 0 / .6); overflow: hidden; }
      .chrome { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #24272f; border-bottom: 1px solid #343846; }
      .lights { display: flex; gap: 7px; }
      .lights i { width: 11px; height: 11px; border-radius: 50%; background: #4a4e5a; display: block; }
      .url { flex: 1; height: 28px; border-radius: 999px; background: #15171c; display: flex; align-items: center; padding: 0 14px;
        color: #9a9fad; font-size: 13px; }
      .url b { color: #ecedf1; font-weight: 400; }
      .ext { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
      .ext.on { background: rgb(124 92 255 / .25); }
      .ext img { width: 18px; height: 18px; }
      .page { position: absolute; top: 46px; left: 0; right: 0; bottom: 0; background: #101114; }
      .page-title { position: absolute; left: 40px; top: 18px; color: #9a9fad; font-size: 13px; }

      /* Video: çizilmiş manzara */
      .video { position: absolute; left: 40px; right: 40px; top: 46px; bottom: 30px; border-radius: 6px; overflow: hidden;
        background: linear-gradient(#ff9a6b 0%, #ffb37d 30%, #ffd59a 48%, #6d5ba8 48.2%, #3c2f7a 100%); }
      .sun { position: absolute; left: 58%; top: 22%; width: 120px; height: 120px; border-radius: 50%;
        background: radial-gradient(#fff6d8, #ffd27a 60%, rgb(255 210 122 / 0)); }
      .hill { position: absolute; border-radius: 50%; }
      .h1 { left: -10%; width: 70%; height: 70%; top: 40%; background: #4b3c8f; }
      .h2 { left: 35%; width: 90%; height: 80%; top: 44%; background: #3a2d78; }
      .h3 { left: -20%; width: 80%; height: 70%; top: 58%; background: #2b2163; }
      .controls { position: absolute; left: 0; right: 0; bottom: 0; height: 54px; padding: 0 18px; display: flex; align-items: center; gap: 14px;
        background: linear-gradient(transparent, rgb(0 0 0 / .65)); font-size: 13px; color: #fff; }
      .progress { flex: 1; height: 4px; border-radius: 2px; background: rgb(255 255 255 / .3); position: relative; }
      .progress::before { content: ''; position: absolute; inset: 0 62% 0 0; background: #fff; border-radius: 2px; }

      /* ---- Eklenti katmanı (overlay.ts ile aynı stiller) ---- */
      .root { position: absolute; inset: 0; pointer-events: none; font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #ecedf1; }
      .float { position: absolute; display: flex; flex-direction: column; align-items: center; }
      .emoji { font-size: 40px; line-height: 1; filter: drop-shadow(0 2px 6px rgb(0 0 0 / .5)); }
      .name { font-size: 12px; font-weight: 600; background: rgb(0 0 0 / .55); padding: 1px 6px; border-radius: 6px; margin-top: 2px; }
      .toasts { position: absolute; right: 12px; top: 98px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; max-width: 380px; }
      .toast { background: rgb(0 0 0 / .72); border: 1px solid rgb(255 255 255 / .12); padding: 5px 11px; border-radius: 12px; font-size: 14px; text-align: right; }
      .toast b { color: #a48dff; }
      .toast.me b { color: #3ccf8e; }
      .toast.notice { font-size: 12px; color: #c9cbd3; font-style: italic; padding: 3px 10px; }
      .bar { position: absolute; top: 12px; right: 12px; width: 400px; display: flex; flex-direction: column; gap: 8px; padding: 8px;
        border-radius: 12px; background: rgb(15 16 20 / .88); border: 1px solid rgb(255 255 255 / .12); box-shadow: 0 6px 24px rgb(0 0 0 / .45); }
      .fab { position: absolute; top: 12px; right: 12px; display: flex; align-items: center; gap: 6px; background: rgb(15 16 20 / .85);
        border: 1px solid rgb(255 255 255 / .18); color: #fff; border-radius: 999px; padding: 5px 11px 5px 5px; font-weight: 600; }
      .logo { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #7c5cff; font-size: 9px; }
      .row { display: flex; align-items: center; gap: 4px; }
      .spacer { flex: 1; }
      .reaction { width: 28px; height: 28px; border-radius: 999px; background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .12);
        font-size: 15px; display: grid; place-items: center; }
      .icon { min-width: 28px; height: 28px; border-radius: 8px; background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .12);
        font-size: 13px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; gap: 3px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #3ccf8e; margin: 0 4px; }
      .field { flex: 1; height: 30px; border-radius: 8px; background: rgb(0 0 0 / .45); border: 1px solid rgb(255 255 255 / .2); padding: 6px 8px; color: #fff; }
      .field.ph { color: #8b8f9b; }
      .select { height: 30px; border-radius: 8px; background: rgb(0 0 0 / .45); border: 1px solid rgb(255 255 255 / .2); padding: 6px 8px; }
      .send { background: #7c5cff; border-color: #7c5cff; }
      .waiting { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 999px;
        background: rgb(0 0 0 / .78); border: 1px solid rgb(255 255 255 / .15); font-size: 14px; font-weight: 600; white-space: nowrap; }
      .tip { position: absolute; background: #2a2d36; border: 1px solid #444957; border-radius: 6px; padding: 6px 9px; font-size: 12px; white-space: pre; }
      .menu { position: absolute; background: #23262e; border: 1px solid #444957; border-radius: 8px; padding: 4px 0; font-size: 13px; width: 70px; }
      .menu div { padding: 3px 12px; }
      .menu .sel { background: #7c5cff; }

      /* ---- Popup (popup.css ile aynı) ---- */
      .popup { position: absolute; top: 40px; right: 14px; width: 340px; padding: 14px; background: #0f1014; border: 1px solid #343846;
        border-radius: 10px; box-shadow: 0 16px 50px rgb(0 0 0 / .65); display: flex; flex-direction: column; gap: 12px; font-size: 14px; z-index: 5; }
      .popup header { display: flex; align-items: center; gap: 8px; }
      .popup .plogo { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; background: #7c5cff; font-size: 10px; }
      .status { margin-left: auto; font-size: 12px; color: #9a9fad; display: flex; align-items: center; gap: 5px; }
      .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #3ccf8e; }
      .me { color: #9a9fad; } .me b { color: #ecedf1; } .me a { color: #8f74ff; margin-left: 6px; }
      .card { background: #181a21; border: 1px solid #2c303b; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
      .label { font-size: 12px; color: #9a9fad; font-weight: 600; }
      .prow { display: flex; gap: 6px; }
      .input { flex: 1; min-width: 0; background: #181a21; border: 1px solid #2c303b; border-radius: 8px; padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .btn { border: 1px solid #2c303b; background: #22252e; padding: 8px 12px; border-radius: 8px; font-weight: 600; }
      .btn.danger { color: #ff6b6b; text-align: center; }
      .muted { color: #9a9fad; font-size: 12px; }
      .reactions { display: flex; justify-content: space-between; }
      .reactions span { width: 34px; height: 34px; border-radius: 999px; background: #181a21; border: 1px solid #2c303b; display: grid; place-items: center; font-size: 17px; }
      .members { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
      .members li::before { content: '●'; color: #3ccf8e; margin-right: 6px; font-size: 9px; vertical-align: middle; }

      /* Küçük tanıtım kutusu (440x280) */
      body.promo { width: 440px; height: 280px; background: linear-gradient(135deg, #2a1f5c, #0f1014 75%); }
      /* Headless Chrome pencereyi 440'tan geniş açabiliyor; görüntü sol üstten kesildiği için genişlik sabit. */
      .promo-box { position: absolute; left: 0; top: 0; width: 440px; height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
      .promo-box img { width: 96px; height: 96px; filter: drop-shadow(0 10px 24px rgb(124 92 255 / .45)); }
      .promo-box h1 { margin: 0; font-size: 34px; letter-spacing: -0.5px; }
      .promo-box p { margin: 0; font-size: 16px; color: #c3c6d4; }
      .promo-emoji { position: absolute; font-size: 30px; filter: drop-shadow(0 2px 6px rgb(0 0 0 / .5)); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const shot = new URLSearchParams(location.search).get('shot') || '1';
      const REACTIONS = ['😂', '😮', '😍', '😱', '👏', '🔥', '😢', '💀'];
      const app = document.getElementById('app');

      const video = (overlay) => `
        <div class="video">
          <div class="sun"></div><div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div>
          <div class="controls"><span>⏸</span><span>38:12 / 1:41:05</span><div class="progress"></div><span>⚙</span><span>⛶</span></div>
          <div class="root">${overlay}</div>
        </div>`;

      const bar = (speed = '1x') => `
        <div class="bar">
          <div class="row">${REACTIONS.map((e) => `<span class="reaction">${e}</span>`).join('')}<span class="spacer"></span>
            <span class="dot"></span><span class="icon">👥 3</span><span class="icon">🔗</span><span class="icon">⏭</span><span class="icon">✕</span></div>
          <div class="row"><span class="field ph">Quick message…</span><span class="icon send">➤</span><span class="select">${speed} ▾</span></div>
        </div>`;

      const windowFrame = (inner, popupOpen = false) => `
        <div class="window">
          <div class="chrome">
            <div class="lights"><i></i><i></i><i></i></div>
            <div class="url">🔒&nbsp;&nbsp;<b>example.com</b>/watch/the-long-summer</div>
            <div class="ext ${popupOpen ? 'on' : ''}"><img src="../icon32.png" alt="" /></div>
          </div>
          <div class="page"><div class="page-title">The Long Summer · Episode 3</div>${inner}</div>
        </div>`;

      const headline = (title, sub) => `<div class="headline"><h1>${title}</h1><p>${sub}</p></div>`;

      if (shot === '1') {
        app.innerHTML =
          headline('Watch any video together, in sync', 'Play, pause, seek and speed happen for everyone at the same moment.') +
          windowFrame(
            video(`
              ${bar()}
              <div class="toasts">
                <div class="toast notice">🐼 Mia joined</div>
                <div class="toast"><b>🦊 Alex:</b> wait for this part 👀</div>
                <div class="toast me"><b>🐸 Sam:</b> no way!!</div>
              </div>
              <div class="float" style="left: 22%; bottom: 30%"><span class="emoji">😂</span><span class="name">🐼 Mia</span></div>
              <div class="float" style="left: 30%; bottom: 46%; opacity: .8"><span class="emoji">🔥</span><span class="name">🦊 Alex</span></div>
              <div class="float" style="left: 15%; bottom: 56%; opacity: .55"><span class="emoji">😱</span><span class="name">🐸 Sam</span></div>
            `),
          );
      } else if (shot === '2') {
        app.innerHTML =
          headline('Create a room in one click', 'Send the invite link: friends land on the same page, in the same room.') +
          windowFrame(
            `<div class="popup">
              <header><span class="plogo">▶</span><strong>ScreenWithMe</strong><span class="status">Connected</span></header>
              <div class="me">🐸 <b>Sam</b><a>Change</a></div>
              <div class="card"><div class="label">Invite link</div>
                <div class="prow"><span class="input">screen-with-me…/r/k3x9q2#swm</span><span class="btn">Copied</span></div></div>
              <div class="card"><div class="label">Open in the room</div>
                <div style="font-weight: 600">The Long Summer · Episode 3</div>
                <div class="muted">Video found, sync is on.</div></div>
              <div class="reactions">${REACTIONS.map((e) => `<span>${e}</span>`).join('')}</div>
              <div class="card"><div class="label">In the room (3)</div>
                <ul class="members"><li><b>🐸 Sam (you)</b></li><li>🦊 Alex</li><li>🐼 Mia</li></ul></div>
              <div class="btn danger">Leave room</div>
            </div>` + video(`<div class="fab"><span class="logo">▶</span>ScreenWithMe</div>`),
            true,
          );
      } else if (shot === '3') {
        app.innerHTML =
          headline('Nobody gets left behind', 'The room waits for slow connections, and everyone shares the same speed.') +
          windowFrame(
            video(`
              <div class="waiting">⏳ Waiting for Mia…</div>
              ${bar('1.25x')}
              <div class="menu" style="right: 12px; top: 92px">
                <div>0.5x</div><div>0.75x</div><div>1x</div><div class="sel">1.25x</div><div>1.5x</div><div>1.75x</div><div>2x</div></div>
              <div class="tip" style="right: 160px; top: 104px">Sync: 40 ms from the room</div>
              <div class="toasts" style="top: 280px"><div class="toast"><b>🦊 Alex:</b> 1.25x is perfect for this</div></div>
            `),
          );
      } else if (shot === 'promo') {
        document.body.className = 'promo';
        app.innerHTML = `
          <div class="promo-box">
            <img src="../icon128.png" alt="" />
            <h1>ScreenWithMe</h1>
            <p>Watch videos together, in sync</p>
          </div>
          <span class="promo-emoji" style="left: 40px; top: 46px">😂</span>
          <span class="promo-emoji" style="left: 360px; top: 58px">🔥</span>
          <span class="promo-emoji" style="left: 62px; top: 196px">🍿</span>
          <span class="promo-emoji" style="left: 348px; top: 190px">😍</span>`;
      }
    </script>
  </body>
</html>
