<!doctype html>
<!--
  Mağaza ekran görüntüleri. Film sayfasının üstündeki oda katmanı sitenin oda sayfasının kendisi
  olduğu için taklidi room.html'de, sitenin gerçek CSS'iyle çizilir; burada tarayıcı penceresinin
  içine iframe olarak (küçültülmüş) konur. Popup, popup.css ile aynı. "Video" çizilmiş bir manzara.
  scripts/store-shots.mjs bunu yerel sunucudan ?shot=1..5|promo|edge|og ile headless Chrome'da açıp PNG yapar.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { width: 1280px; height: 800px; overflow: hidden; color: #eceefa; position: relative;
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 20% 0%, #2a1f5c 0%, #0b0d1a 60%); }
      .headline { position: absolute; left: 0; right: 0; top: 16px; text-align: center; }
      .headline h1 { margin: 0; font-size: 36px; letter-spacing: -0.5px; }
      .headline p { margin: 4px 0 0; font-size: 18px; color: #b9bccb; }

      /* Tarayıcı penceresi taklidi; içi oda taklidinin (room.html) küçültülmüş hali */
      .window { position: absolute; border-radius: 14px 14px 0 0; background: #1d2027; border: 1px solid #343846;
        box-shadow: 0 30px 80px rgb(0 0 0 / .6); overflow: hidden; }
      .chrome { height: 42px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #24272f; border-bottom: 1px solid #343846; }
      .lights { display: flex; gap: 7px; }
      .lights i { width: 11px; height: 11px; border-radius: 50%; background: #4a4e5a; display: block; }
      .url { flex: 1; min-width: 0; height: 26px; border-radius: 999px; background: #15171c; display: flex; align-items: center; padding: 0 14px;
        color: #9a9fad; font-size: 13px; white-space: nowrap; overflow: hidden; }
      .url b { color: #ecedf1; font-weight: 400; }
      .ext { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; }
      .ext.on { background: rgb(124 92 255 / .3); }
      .ext img { width: 18px; height: 18px; }
      .page { position: absolute; top: 42px; left: 0; overflow: hidden; }
      .page iframe { border: 0; transform-origin: 0 0; display: block; }

      /* Adım etiketleri (2. görüntü) */
      .step { position: absolute; display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
      .step i { flex: none; width: 32px; height: 32px; border-radius: 50%; background: #8b6cff; color: #fff; font-style: normal;
        display: grid; place-items: center; font-size: 17px; box-shadow: 0 0 0 4px rgb(139 108 255 / .25); }
      .step span { font-weight: 400; color: #b9bccb; font-size: 15px; display: block; }
      /* Görüntüde dikkat çekilen yer: parlayan çerçeve */
      .ring { position: absolute; border: 3px solid #ffd27a; border-radius: 10px; box-shadow: 0 0 0 4px rgb(255 210 122 / .25), 0 0 24px rgb(255 210 122 / .5); }
      .arrow { position: absolute; font-size: 40px; color: #8b6cff; filter: drop-shadow(0 4px 10px rgb(0 0 0 / .5)); }

      /* Popup (popup.css ile aynı) */
      .popup { position: absolute; width: 320px; padding: 16px; background: #0f1014; border: 1px solid #343846; border-radius: 10px;
        box-shadow: 0 16px 50px rgb(0 0 0 / .7); font-size: 14px; line-height: 1.45; color: #ecedf1; z-index: 5; }
      .popup header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .popup header img { width: 32px; height: 32px; }
      .popup header strong { font-size: 16px; }
      .popup p { margin: 0 0 14px; color: #9a9fad; }
      .popup .btn { display: block; padding: 10px 14px; border-radius: 10px; background: #7c5cff; color: #fff; font-weight: 600; text-align: center; }
      .popup .version { margin: 12px 0 0; font-size: 11px; text-align: center; }

      /* Gizlilik maddeleri (5. görüntü) */
      .points { position: absolute; left: 50px; top: 150px; width: 400px; display: flex; flex-direction: column; gap: 14px; }
      .point { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: 14px; background: rgb(21 26 46 / .9);
        border: 1px solid #2a3152; box-shadow: 0 12px 30px rgb(0 0 0 / .35); }
      .point em { font-style: normal; font-size: 28px; line-height: 1; }
      .point b { display: block; font-size: 18px; margin-bottom: 3px; }
      .point span { color: #9aa0c2; font-size: 14.5px; }

      /* Davet linki önizlemesi (Open Graph, 1200x630) */
      body.og { width: 1200px; height: 630px; background: radial-gradient(900px 500px at 30% 0%, #3a2a8c, #0f1014 70%); }
      .og-box { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; display: flex; align-items: center; gap: 56px; padding: 0 90px; }
      .og-box img { width: 330px; height: 330px; filter: drop-shadow(0 20px 50px rgb(124 92 255 / .5)); }
      .og-box h1 { margin: 0; font-size: 68px; line-height: 1.05; letter-spacing: -1px; }
      .og-box p { margin: 18px 0 0; font-size: 28px; color: #c3c6d4; }
      .og-box .brand { display: flex; align-items: center; gap: 12px; margin-top: 34px; font-size: 26px; font-weight: 700; color: #ecedf1; }
      .og-box .brand img { width: 44px; height: 44px; filter: none; }

      /* Küçük tanıtım kutusu (440x280) */
      body.promo { width: 440px; height: 280px; background: linear-gradient(135deg, #2a1f5c, #0f1014 75%); }
      /* Headless Chrome pencereyi 440'tan geniş açabiliyor; görüntü sol üstten kesildiği için genişlik sabit. */
      .promo-box { position: absolute; left: 0; top: 0; width: 440px; height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
      .promo-box img { width: 96px; height: 96px; filter: drop-shadow(0 10px 24px rgb(124 92 255 / .45)); }
      .promo-box h1 { margin: 0; font-size: 34px; letter-spacing: -0.5px; }
      .promo-box p { margin: 0; font-size: 16px; color: #c3c6d4; }
      .promo-emoji { position: absolute; font-size: 30px; filter: drop-shadow(0 2px 6px rgb(0 0 0 / .5)); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const shot = new URLSearchParams(location.search).get('shot') || '1';
      const app = document.getElementById('app');
      const FILM_URL = '🔒&nbsp;&nbsp;<b>example.com</b>/videos/sunset-hills-part-3';
      const SITE_URL = '🔒&nbsp;&nbsp;<b>screen-with-me.swm-server.workers.dev</b>/r/k3x9q2';

      /**
       * Pencere: (x, y) konumu, w genişliği, h sayfa yüksekliği; iframe vw×vh boyutunda açılıp
       * pencereye sığacak kadar küçültülür (oda sitenin masaüstü düzeninde görünsün).
       */
      const windowFrame = ({ x, y, w, h, url, room, vw = 1467, ext = false }) => {
        const scale = w / vw;
        const vh = Math.ceil(h / scale);
        return `
          <div class="window" style="left:${x}px; top:${y}px; width:${w}px; height:${h + 42}px">
            <div class="chrome">
              <div class="lights"><i></i><i></i><i></i></div>
              <div class="url">${url}</div>
              <div class="ext ${ext ? 'on' : ''}"><img src="../icon32.png" alt="" /></div>
            </div>
            <div class="page" style="width:${w}px; height:${h}px">
              <iframe src="room.html?${room}" style="width:${vw}px; height:${vh}px; transform: scale(${scale})"></iframe>
            </div>
          </div>`;
      };

      const headline = (title, sub) => `<div class="headline"><h1>${title}</h1><p>${sub}</p></div>`;
      // Tam oda görünümü 1467×870'te sığar; 1100 genişlikte pencere alta dayanır.
      const bigWindow = (room, extra = {}) => windowFrame({ x: 90, y: 102, w: 1100, h: 653, url: FILM_URL, room, ...extra });

      if (shot === '1') {
        app.innerHTML =
          headline('Watch any video together, in sync', 'The film site turns into your room: the video in the middle, chat and reactions around it.') +
          bigWindow('reacts=1');
      } else if (shot === '2') {
        app.innerHTML =
          headline('From a link to a watch party in seconds', 'Create a room on our website, paste the page with the video, and everyone goes there together.') +
          `<div class="step" style="left: 40px; top: 118px"><i>1</i><div>Paste the page's link in your room<span>Friends get a “Go to the film” card</span></div></div>` +
          windowFrame({ x: 30, y: 180, w: 590, h: 620, url: SITE_URL, room: 'view=external', vw: 1040 }) +
          `<div class="step" style="left: 670px; top: 118px"><i>2</i><div>The film page opens as your room<span>Room view around the video, right away</span></div></div>` +
          windowFrame({ x: 660, y: 180, w: 590, h: 620, url: FILM_URL, room: 'view=film', vw: 1100, ext: true }) +
          `<div class="arrow" style="left: 618px; top: 440px">➜</div>` +
          `<div class="ring" style="left: 98px; top: 480px; width: 274px; height: 41px"></div>`;
      } else if (shot === '3') {
        app.innerHTML =
          headline('Nobody gets left behind', 'The room waits for anyone still buffering, and everyone shares the same speed.') +
          bigWindow('wait=1&rate=1.25&tab=people');
      } else if (shot === '4') {
        app.innerHTML =
          headline('Make your room yours', 'Ten themes with our mascot in costume, drawn avatars, and your own emojis and GIFs.') +
          bigWindow('theme=sinema&dialog=theme');
      } else if (shot === '5') {
        app.innerHTML =
          headline('Private by design', 'No account, no ads, no tracking. It only works in the tab you joined a room with.') +
          `<div class="points">
            <div class="point"><em>🙈</em><div><b>No account</b><span>Pick a name and an avatar, that's it. Nothing to sign up for.</span></div></div>
            <div class="point"><em>🚫</em><div><b>No ads, no trackers</b><span>No third-party analytics. Free.</span></div></div>
            <div class="point"><em>🎯</em><div><b>Only in the room's tab</b><span>Dormant on every other page and tab.</span></div></div>
            <div class="point"><em>🔒</em><div><b>Videos stay on your side</b><span>Each person plays the video in their own browser; our server only relays sync messages and chat.</span></div></div>
          </div>` +
          windowFrame({ x: 490, y: 150, w: 760, h: 650, url: FILM_URL, room: 'reacts=1', vw: 1250, ext: true }) +
          `<div class="popup" style="left: 914px; top: 190px">
            <header><img src="../../apps/extension/static/icon48.png" alt="" /><strong>Sidelit</strong></header>
            <p>This tab is in a room: the room is open over the film page.</p>
            <div class="btn">🏠 Back to the room</div>
            <p class="version" id="version"></p>
          </div>`;
        // Popup'taki sürüm eklentinin package.json'ından (görüntü her üretildiğinde güncel)
        fetch('/apps/extension/package.json').then((r) => r.json()).then(({ version }) => (document.getElementById('version').textContent = `v${version}`));
      } else if (shot === 'og') {
        document.body.className = 'og';
        app.innerHTML = `
          <div class="og-box">
            <img src="../../apps/web/public/mascot.svg" alt="" />
            <div>
              <h1>Sana bir koltuk<br />ayırdım 🍿</h1>
              <p>Linke tıkla, odaya gir, film başlasın.</p>
              <div class="brand"><img src="../icon128.png" alt="" />Sidelit</div>
            </div>
          </div>`;
      } else if (shot === 'edge') {
        // Edge Add-ons store logo (300 x 300, square, opaque): the full-bleed maskable icon.
        document.body.className = 'edge';
        app.innerHTML = `<img src="/icons/icon-maskable-512.png" alt="" width="300" height="300" style="display:block" />`;
      } else if (shot === 'promo') {
        document.body.className = 'promo';
        app.innerHTML = `
          <div class="promo-box">
            <img src="../icon128.png" alt="" />
            <h1>Sidelit</h1>
            <p>Watch videos together, in sync</p>
          </div>
          <span class="promo-emoji" style="left: 40px; top: 46px">😂</span>
          <span class="promo-emoji" style="left: 360px; top: 58px">🔥</span>
          <span class="promo-emoji" style="left: 62px; top: 196px">🍿</span>
          <span class="promo-emoji" style="left: 348px; top: 190px">😍</span>`;
      }
    </script>
  </body>
</html>
