<!doctype html>
<!--
  Mağaza görüntüleri için oda taklidi: film sayfasının üstünde eklentinin açtığı katman (kabuk)
  sitenin oda sayfasının kendisi olduğu için burada da sitenin gerçek styles.css'i ve
  room.ts'teki işaretleme kullanılır, içerik sabittir. Film videosu odanın oynatıcı deliğinde
  çizilmiş bir manzara (telifli görüntü yok). shots.html bunu iframe'de, küçültülmüş açar.

  ?view=film (oda görünümü) | external (sitedeki "Filme git" kartı)
  &tab=chat|people  &theme=<tema>  &wait=1  &rate=1.25  &dialog=theme  &reacts=1
-->
<html lang="en" class="shell in-room">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/apps/web/src/styles.css" />
    <style>
      /* Kaydırma çubuğu ve imleç görüntüde olmasın; animasyonlar ilk karede dursun. */
      html { scrollbar-width: none; }
      *, *::before, *::after { animation: none !important; transition: none !important; }

      /* Film videosu: çizilmiş gün batımı tepeleri */
      .film { position: absolute; inset: 0; overflow: hidden;
        background: linear-gradient(#ff9a6b 0%, #ffb37d 30%, #ffd59a 48%, #6d5ba8 48.2%, #3c2f7a 100%); }
      .film .sun { position: absolute; left: 58%; top: 20%; width: 15%; aspect-ratio: 1; border-radius: 50%;
        background: radial-gradient(#fff6d8, #ffd27a 60%, rgb(255 210 122 / 0)); }
      .film .hill { position: absolute; border-radius: 50%; }
      .film .h1 { left: -10%; width: 70%; height: 70%; top: 40%; background: #4b3c8f; }
      .film .h2 { left: 35%; width: 90%; height: 80%; top: 44%; background: #3a2d78; }
      .film .h3 { left: -20%; width: 80%; height: 70%; top: 58%; background: #2b2163; }
      .film .bird { position: absolute; color: #3b2a63; font-size: 22px; transform: scaleX(1.6); }

      /* Görüntüde tema penceresi solda ve hafif karartmalı: arkadaki temalı oda ve sohbetteki avatarlar görünsün */
      .dialog-backdrop.shot { background: rgb(0 0 0 / .3); backdrop-filter: none; place-items: start; padding: 150px 0 0 150px; }
      .dialog-backdrop.shot .theme-dialog { width: 700px; }
      .cursor { position: absolute; left: calc(50% + 26px); top: calc(50% + 22px); font-size: 34px; filter: drop-shadow(0 2px 3px rgb(0 0 0 / .5)); }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand"><img class="logo" src="/logo.svg" alt="" /> <span class="wordmark">Sidelit</span></a>
      <div class="room-title"><button type="button" class="room-title-dot" data-status="open"></button><b class="room-title-name">Friday movie night</b><span class="room-title-count">· 4 people</span></div>
      <div class="topbar-right">
        <button type="button" class="btn primary small-btn invite-btn"><span>🔗</span><span class="invite-text">Invite</span></button>
        <button type="button" class="nav-link room-more-btn" title="More">⋯</button>
        <button type="button" class="nav-link shell-home">🏠 Back to the room</button>
        <button type="button" class="nav-link profile-btn"><span class="profile-avatar drawn"><img src="/avatars/captain.svg" alt="" /></span></button>
        <button type="button" class="nav-link settings-btn">⚙️</button>
      </div>
    </header>
    <main id="app"></main>
    <script>
      const q = new URLSearchParams(location.search);
      const view = q.get('view') || 'film';
      const tab = q.get('tab') || 'chat';
      const rate = q.get('rate') || '1';
      if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
      // Kabuk sadece film sayfasında; sitedeki oda (external) normal site görünümü.
      if (view === 'external') {
        document.documentElement.classList.remove('shell');
        document.querySelector('.shell-home').remove();
        document.querySelector('.topbar-right').insertAdjacentHTML('afterbegin', '<a class="nav-link">🧩 Extension</a>');
      }

      const REACTIONS = ['😂', '😮', '😍', '😱', '👏', '🔥', '😢', '💀'];
      const av = (a, cls) => (/^[a-z]+$/.test(a) ? `<span class="${cls} drawn"><img src="/avatars/${a}.svg" alt=""></span>` : `<span class="${cls}">${a}</span>`);
      const PEOPLE = [
        { name: 'Sam', avatar: 'captain', me: true, host: true },
        { name: 'Alex', avatar: 'speedster' },
        { name: 'Mia', avatar: 'elf' },
        { name: 'Leo', avatar: 'wizard' },
      ];
      const person = (n) => PEOPLE.find((p) => p.name === n);

      // Sitedeki gibi balonlar (ui/chat.ts): benimkiler sağda, aynı kişinin art arda mesajları birleşik.
      const chatLine = (n, time, text, i, all) => {
        const p = person(n);
        const cont = i > 0 && all[i - 1][0] === n;
        const meta = p.me ? `<div class="chat-meta"><time>${time}</time></div>` : `<div class="chat-meta"><span class="chat-name">${n}</span><time>${time}</time></div>`;
        return `<li class="chat-line${p.me ? ' me' : ''}${cont ? ' cont' : ''}">${p.me ? '' : av(p.avatar, 'chat-avatar')}<div class="chat-body">${cont ? '' : meta}<p class="chat-text">${text}</p></div></li>`;
      };
      const CHAT = {
        film: [
          ['Alex', '21:02', 'everyone ready? 🍿'],
          ['Mia', '21:02', 'yes!! start it'],
          ['Leo', '21:04', 'the music in this part 😍'],
          ['Sam', '21:05', 'wait for the view on the hill…'],
          ['Alex', '21:06', 'no way, that sunset 🔥'],
          ['Mia', '21:06', 'pinned it 📌 rewatching later'],
        ],
        wait: [
          ['Leo', '21:31', 'my wifi is slow tonight 🙈'],
          ['Alex', '21:31', "np, the room waits for you"],
          ['Mia', '21:32', '1.25x is perfect for this part'],
        ],
        external: [
          ['Sam', '20:58', 'found it, opening the page now'],
          ['Alex', '20:58', "let's go! 🎉"],
        ],
      };

      const playerInner =
        view === 'external'
          ? `<div class="overlay external">
               <p class="muted">This video is on another website</p>
               <h2>Sunset Hills · Part 3</h2>
               <p class="external-host">example.com</p>
               <div class="stack external-box">
                 <p>The film opens on its own website; the extension brings the room (chat, emojis, controls) around the video. Room view appears as soon as the video is found.</p>
                 <button type="button" class="btn primary big">Go to the film and watch together</button>
               </div>
             </div>`
          : `<div id="player" class="player"><div class="film"><div class="sun"></div><div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div>
               <span class="bird" style="left: 30%; top: 16%">⌄</span><span class="bird" style="left: 34%; top: 21%; font-size: 16px">⌄</span></div></div>
             <div class="reactions-layer">${
               q.get('reacts')
                 ? [['Mia', '😂', 0, 18, 40], ['Mia', '😂', 0, 24, 120], ['Alex', '🔥', 0, 46, 110], ['Leo', '😍', 0, 72, 70]]
                     .map(([n, e, c, x, y]) => `<div class="r-float" style="left: ${x}%; animation: none; transform: translateY(-${y}px)"><span class="r-emoji">${e}</span><span class="r-who">${av(person(n).avatar, 'r-avatar')}<span class="r-name">${n}</span></span></div>`)
                     .join('')
                 : ''
             }</div>
             ${q.get('wait') ? '<div class="waiting-banner" role="status">⏳ Waiting for 🧙 Leo…</div>' : ''}`;

      const pins = view === 'external' ? '' : `<div class="pin-strip"><div class="pin-track"></div>${[12, 37, 58]
        .map((p) => `<span class="pin-wrap" style="left: ${p}%"><button type="button" class="pin-mark">📌</button></span>`)
        .join('')}</div>`;

      const panels = {
        chat: `<div class="tab-panel chat-panel">
            <button type="button" class="chat-events" aria-pressed="false">Show activity (4)</button>
            <ul class="chat-list">${(CHAT[view === 'external' ? 'external' : q.get('wait') ? 'wait' : 'film'] || []).map((l, i, all) => chatLine(...l, i, all)).join('')}</ul>
            <form class="chat-form"><input id="chat-input" placeholder="Say something…" /><button type="button" class="chat-attach">🖼️</button><button class="chat-send">➤</button></form>
          </div>`,
        people: `<div class="tab-panel"><ul class="people">${PEOPLE.map(
            (p) => `<li class="person${p.me ? ' me' : ''}">${av(p.avatar, 'person-avatar')}<span class="person-name">${p.me ? p.name + ' (you)' : p.name}</span>${p.host ? '<span class="host-badge">👑</span>' : ''}<span class="host-badge">🎬</span>${p.me ? '' : '<button type="button" class="icon-btn kick">✕</button>'}</li>`,
          ).join('')}</ul>
          <p class="muted small">👑 You are the host of this room. Press ✕ next to someone to remove them.</p></div>`,
      };

      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="room">
          <div class="stage">
            <form class="media-form">
              <input placeholder="Search YouTube or paste a link (YouTube, Vimeo, a video file, a film page)" ${view === 'external' ? 'value="https://example.com/videos/sunset-hills-part-3"' : ''} />
              <button class="btn primary">Add to queue</button>
              <button class="btn">Play now</button>
            </form>
            <div class="theater dock-mode dock-window side-rail">
              <div class="now-playing">
                <div class="now-text"><span class="muted small">Now playing</span><span class="now-title">Sunset Hills · Part 3</span></div>
                <button type="button" class="btn small-btn">Next ⏭</button>
              </div>
              <div class="player-wrap${view === 'external' ? '' : ' filming'}">${playerInner}
                <div class="fs-dock" role="toolbar" aria-orientation="vertical">
                  <div class="dock-group"><button type="button" class="dock-btn">😀</button><button type="button" class="dock-btn">📌</button><button type="button" class="dock-btn">🎮</button></div>
                  <div class="dock-group"><button type="button" class="dock-btn">🎙</button><button type="button" class="dock-btn">📷</button></div>
                  <div class="dock-group"><button type="button" class="dock-btn dock-more">⋯</button><button type="button" class="dock-btn">⛶</button></div>
                </div>
              </div>
              ${pins}
            </div>
          </div>
          <aside class="side">
            <section class="card together-card">
              <div class="together-head"><h3 class="together-title">Together</h3><span class="voice-limit muted small">Voice 2/6 · 📷 0/4</span></div>
              <div class="voice-people">${PEOPLE.map(
                (p, i) => `<span class="together-person"><span class="voice-face${i < 2 ? ' in-voice' : ''}${i === 1 ? ' speaking' : ''}">${av(p.avatar, 'voice-avatar')}</span><span class="together-name">${p.me ? 'You' : p.name}</span></span>`,
              ).join('')}</div>
              <div class="together-actions"><div class="voice-row"><div class="voice-on"><button type="button" class="btn small-btn voice-mic">🎙</button><button type="button" class="btn small-btn">📷</button><button type="button" class="btn small-btn">Leave</button></div></div></div>
              <p class="muted small voice-ip">🔒 <span>People in voice can see your IP</span> <button type="button" class="link-btn">Why?</button></p>
            </section>
            <section class="card tabs-card">
              <nav class="tabs">
                <button type="button" class="tab" aria-selected="${tab === 'chat'}"><span>💬</span><span>Chat</span></button>
                <button type="button" class="tab" aria-selected="${tab === 'queue'}"><span>🎵</span><span>Queue</span><span class="count">2</span></button>
                <button type="button" class="tab" aria-selected="${tab === 'people'}"><span>👥</span><span>People</span><span class="count">${PEOPLE.length}</span></button>
              </nav>
              ${panels[tab]}
            </section>
          </aside>
        </div>`;

      // Tema penceresi (themes.ts openThemeDialog ile aynı işaretleme)
      if (q.get('dialog') === 'theme') {
        const THEMES = [
          ['gece', 'Night', '#141936', '#8b6cff'], ['okyanus', 'Ocean', '#0b2a45', '#2ec5e8'], ['gunbatimi', 'Sunset', '#3a1530', '#ff7a4d'],
          ['neon', 'Neon', '#050508', '#ff2bd6'], ['lokum', 'Moonlit Nights', '#18224a', '#e0a84a'],
          ['binbirgece', 'Arabian Nights', '#141236', '#e8c27a'], ['sinema', 'Picture Palace', '#0d1020', '#e9b949'], ['opera', 'Opera Night', '#0f3638', '#e8708a'],
          ['acikhava', 'Drive-In', '#1a1340', '#ff8a6b'], ['gemi', 'Ocean Liner', '#24425e', '#ec6a5a'], ['tren', 'Night Express', '#0e1428', '#6fd6a8'],
        ];
        const SCENES = ['lokum', 'binbirgece', 'sinema', 'opera', 'acikhava', 'gemi', 'tren'];
        const now = q.get('theme') || 'gece';
        document.body.insertAdjacentHTML(
          'beforeend',
          `<div class="dialog-backdrop shot"><div class="avatar-dialog theme-dialog card">
            <div class="dialog-head"><h3>Pick a theme (you see it right away behind this window)</h3><button type="button" class="icon-btn dialog-x">✕</button></div>
            <div class="theme-cards">${THEMES.map(([id, name, a, b]) => {
              const scene = SCENES.includes(id) ? `url('/themes/${id}.svg') center bottom / cover no-repeat, ` : '';
              return `<button type="button" class="theme-card" aria-checked="${id === now}" style="--chip-b: ${b}"><span class="theme-preview" style="background: ${scene}linear-gradient(160deg, ${a} 55%, ${b})"><img src="/themes/${id}-maskot.svg" alt=""></span><span class="theme-card-name">${name}</span></button>`;
            }).join('')}</div>
            <div class="dialog-foot"><button type="button" class="btn primary">Done</button></div>
          </div></div>`,
        );
      }
    </script>
  </body>
</html>
