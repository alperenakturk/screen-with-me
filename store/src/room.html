<!doctype html>
<!--
  Mağaza görüntüleri için oda taklidi: film sayfasının üstünde eklentinin açtığı katman (kabuk)
  sitenin oda sayfasının kendisi olduğu için burada da sitenin gerçek styles.css'i ve
  room.ts'teki işaretleme kullanılır, içerik sabittir. Film videosu odanın oynatıcı deliğinde
  çizilmiş bir manzara (telifli görüntü yok). shots.html bunu iframe'de, küçültülmüş açar.

  ?view=film (oda görünümü) | external (sitedeki "Filme git" kartı) | strip (video bulunmadan önce ince şerit)
  &tab=chat|people|settings  &theme=<tema>  &wait=1  &rate=1.25  &dialog=theme  &reacts=1
-->
<html lang="en" class="shell">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/apps/web/src/styles.css" />
    <style>
      /* Kaydırma çubuğu ve imleç görüntüde olmasın; animasyonlar ilk karede dursun. */
      html { scrollbar-width: none; }
      *, *::before, *::after { animation: none !important; transition: none !important; }

      /* Film videosu: çizilmiş gün batımı tepeleri */
      .film { position: absolute; inset: 0; overflow: hidden;
        background: linear-gradient(#ff9a6b 0%, #ffb37d 30%, #ffd59a 48%, #6d5ba8 48.2%, #3c2f7a 100%); }
      .film .sun { position: absolute; left: 58%; top: 20%; width: 15%; aspect-ratio: 1; border-radius: 50%;
        background: radial-gradient(#fff6d8, #ffd27a 60%, rgb(255 210 122 / 0)); }
      .film .hill { position: absolute; border-radius: 50%; }
      .film .h1 { left: -10%; width: 70%; height: 70%; top: 40%; background: #4b3c8f; }
      .film .h2 { left: 35%; width: 90%; height: 80%; top: 44%; background: #3a2d78; }
      .film .h3 { left: -20%; width: 80%; height: 70%; top: 58%; background: #2b2163; }
      .film .bird { position: absolute; color: #3b2a63; font-size: 22px; transform: scaleX(1.6); }

      /* "strip" görünümünde: altta film sitesinin kendi sayfası (eklenti katmanı sadece üst şerit) */
      .film-site { position: fixed; inset: 0; background: #f4f5f7; color: #1d1f24; font: 15px/1.4 system-ui, sans-serif; z-index: 0; }
      .film-site header { height: 64px; display: flex; align-items: center; gap: 28px; padding: 0 40px; margin-top: 56px;
        background: #fff; border-bottom: 1px solid #e3e5ea; font-weight: 700; }
      .film-site header span { font-weight: 500; color: #6a6f7b; }
      .film-site .site-logo { display: flex; align-items: center; gap: 8px; font-size: 18px; }
      .film-site .site-logo i { width: 26px; height: 26px; border-radius: 7px; background: #2f6fed; display: block; }
      .film-site main { max-width: none; padding: 26px 40px; display: grid; grid-template-columns: 1fr 200px; gap: 28px; }
      .film-site .frame { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
      .film-site .frame .film { filter: brightness(.55); }
      .film-site .play { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; transform: translate(-50%, -50%);
        border-radius: 50%; background: rgb(255 255 255 / .92); display: grid; place-items: center; font-size: 34px; color: #222;
        box-shadow: 0 0 0 10px rgb(255 255 255 / .25); }
      .film-site h2 { margin: 16px 0 4px; font-size: 22px; }
      .film-site p { margin: 0; color: #6a6f7b; }
      .film-site aside div { height: 74px; border-radius: 10px; background: #e6e8ee; margin-bottom: 14px; }
      /* Görüntüde tema penceresi solda ve hafif karartmalı: arkadaki temalı oda ve sohbetteki avatarlar görünsün */
      .dialog-backdrop.shot { background: rgb(0 0 0 / .3); backdrop-filter: none; place-items: start; padding: 150px 0 0 150px; }
      .dialog-backdrop.shot .theme-dialog { width: 700px; }
      .cursor { position: absolute; left: calc(50% + 26px); top: calc(50% + 22px); font-size: 34px; filter: drop-shadow(0 2px 3px rgb(0 0 0 / .5)); }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand"><img class="logo" src="/logo.svg" alt="" /> ScreenWithMe</a>
      <div class="topbar-right">
        <button type="button" class="nav-link shell-home">🏠 Back to the room</button>
        <span class="status" data-status="open">Connected</span>
        <button type="button" class="nav-link">🎨</button>
        <div class="lang"><button type="button">TR</button><button type="button" aria-pressed="true">EN</button></div>
      </div>
    </header>
    <main id="app"></main>
    <script>
      const q = new URLSearchParams(location.search);
      const view = q.get('view') || 'film';
      const tab = q.get('tab') || 'chat';
      const rate = q.get('rate') || '1';
      if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
      // Kabuk sadece film sayfasında; sitedeki oda (external) normal site görünümü.
      if (view === 'external') {
        document.documentElement.classList.remove('shell');
        document.querySelector('.shell-home').remove();
        document.querySelector('.topbar-right').insertAdjacentHTML('afterbegin', '<a class="nav-link">🧩 Extension</a>');
      }
      if (view === 'strip') document.documentElement.classList.add('shell-bar');

      const SPEEDS = ['0.5', '0.75', '1', '1.25', '1.5', '1.75', '2'];
      const REACTIONS = ['😂', '😮', '😍', '😱', '👏', '🔥', '😢', '💀'];
      const av = (a, cls) => (/^[a-z]+$/.test(a) ? `<span class="${cls} drawn"><img src="/avatars/${a}.svg" alt=""></span>` : `<span class="${cls}">${a}</span>`);
      const PEOPLE = [
        { name: 'Sam', avatar: 'captain', me: true, host: true },
        { name: 'Alex', avatar: '🦊' },
        { name: 'Mia', avatar: 'elf' },
        { name: 'Leo', avatar: '🐼' },
      ];
      const person = (n) => PEOPLE.find((p) => p.name === n);

      const chatLine = (n, time, text) => {
        const p = person(n);
        return `<li class="chat-line${p.me ? ' me' : ''}">${av(p.avatar, 'chat-avatar')}<div class="chat-body"><div class="chat-meta"><span class="chat-name">${n}</span><time>${time}</time></div><p class="chat-text">${text}</p></div></li>`;
      };
      const CHAT = {
        film: [
          ['Alex', '21:02', 'everyone ready? 🍿'],
          ['Mia', '21:02', 'yes!! start it'],
          ['Leo', '21:04', 'the music in this part 😍'],
          ['Sam', '21:05', 'wait for the view on the hill…'],
          ['Alex', '21:06', 'no way, that sunset 🔥'],
          ['Mia', '21:06', 'pinned it 📌 rewatching later'],
        ],
        wait: [
          ['Leo', '21:31', 'my wifi is slow tonight 🙈'],
          ['Alex', '21:31', "np, the room waits for you"],
          ['Mia', '21:32', '1.25x is perfect for this part'],
        ],
        external: [
          ['Sam', '20:58', 'found it, opening the page now'],
          ['Alex', '20:58', "let's go! 🎉"],
        ],
      };

      const playerInner =
        view === 'external'
          ? `<div class="overlay external">
               <p class="muted">This video is on another website</p>
               <h2>Sunset Hills · Part 3</h2>
               <p class="external-host">example.com</p>
               <div class="stack external-box">
                 <p>The film opens on its own website; the extension brings the room (chat, emojis, controls) around the video. Room view appears as soon as the video is found.</p>
                 <button type="button" class="btn primary big">Go to the film and watch together</button>
               </div>
             </div>`
          : `<div id="player" class="player"><div class="film"><div class="sun"></div><div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div>
               <span class="bird" style="left: 30%; top: 16%">⌄</span><span class="bird" style="left: 34%; top: 21%; font-size: 16px">⌄</span></div></div>
             <div class="reactions-layer">${
               q.get('reacts')
                 ? [['Mia', '😂', 2], ['Alex', '🔥', 0], ['Leo', '😍', 0]]
                     .map(([n, e, c]) => `<div class="r-card" data-count="${c || 1}">${av(person(n).avatar, 'r-avatar')}<span class="r-name">${n}</span><span class="r-emoji">${e}</span><span class="r-count">${c ? '×' + c : ''}</span></div>`)
                     .join('')
                 : ''
             }</div>
             ${q.get('wait') ? '<div class="waiting-banner" role="status">⏳ Waiting for 🐼 Leo…</div>' : ''}`;

      const pins = view === 'external' ? '' : `<div class="pin-strip"><div class="pin-track"></div>${[12, 37, 58]
        .map((p) => `<span class="pin-wrap" style="left: ${p}%"><button type="button" class="pin-mark">📌</button></span>`)
        .join('')}</div>`;

      const panels = {
        chat: `<div class="tab-panel chat-panel">
            <button type="button" class="chat-events" aria-pressed="false">Show activity (4)</button>
            <ul class="chat-list">${(CHAT[view === 'external' ? 'external' : q.get('wait') ? 'wait' : 'film'] || []).map((l) => chatLine(...l)).join('')}</ul>
            <form class="row chat-form"><input placeholder="Say something…" /><button class="btn primary">Send</button></form>
          </div>`,
        people: `<div class="tab-panel"><ul class="people">${PEOPLE.map(
            (p) => `<li class="person${p.me ? ' me' : ''}">${av(p.avatar, 'person-avatar')}<span class="person-name">${p.me ? p.name + ' (you)' : p.name}</span>${p.host ? '<span class="host-badge">👑</span>' : ''}<span class="host-badge">🎬</span>${p.me ? '' : '<button type="button" class="icon-btn kick">✕</button>'}</li>`,
          ).join('')}</ul>
          <p class="muted small">👑 You are the host of this room. Press ✕ next to someone to remove them.</p></div>`,
        settings: `<div class="tab-panel settings">
            <h4>Profile</h4>
            <label class="muted small">Your name (others in the room see it)</label>
            <form class="row"><input value="Sam" /><button class="btn">Change name</button></form>
            <div class="avatar-current">${av('captain', 'avatar-glyph')}<button type="button" class="btn">Change avatar</button></div>
            <h4>Theme</h4>
            <div class="theme-current"><span class="theme-now"><img src="/themes/${q.get('theme') || 'gece'}-maskot.svg" alt="" /><b>Picture Palace</b></span><button type="button" class="btn">Change theme</button></div>
          </div>`,
      };

      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="room">
          <div class="shell-strip">
            <img class="strip-logo" src="/logo.svg" alt="" />
            <b class="strip-brand">ScreenWithMe</b>
            <span class="strip-room">Friday movie night</span>
            <span class="strip-hint">Start the video: room view opens by itself</span>
            <button type="button" class="btn small-btn">🏠 Back to the room</button>
          </div>
          <div class="stage">
            <form class="media-form">
              <input placeholder="Paste a YouTube link, a video link or the link of the page with the video" ${view === 'external' ? 'value="https://example.com/videos/sunset-hills-part-3"' : ''} />
              <button class="btn primary">Add to queue</button>
              <button class="btn">Play now</button>
            </form>
            <div class="theater">
              <div class="now-playing">
                <div class="now-text"><span class="muted small">Now playing</span><span class="now-title">Sunset Hills · Part 3</span></div>
                <button type="button" class="btn small-btn">Next ⏭</button>
              </div>
              <div class="player-wrap${view === 'external' ? '' : ' filming'}">${playerInner}</div>
              ${pins}
              <div class="toolbar">
                <div class="reaction-bar">${REACTIONS.map((e) => `<button type="button" class="reaction-btn">${e}</button>`).join('')}<span class="reaction-pager"><button type="button" class="reaction-page">▲</button><button type="button" class="reaction-page">▼</button></span><button type="button" class="reaction-btn sticker-open">🖼️</button></div>
                <div class="toolbar-right">
                  <button type="button" class="icon-btn tool-btn">📌</button>
                  <button type="button" class="icon-btn tool-btn">🔄</button>
                  <div class="speed">
                    <button type="button" class="icon-btn speed-step">−</button>
                    <select>${SPEEDS.map((s) => `<option${s === rate ? ' selected' : ''}>${s}x</option>`).join('')}</select>
                    <button type="button" class="icon-btn speed-step">+</button>
                  </div>
                  <button type="button" class="icon-btn big-icon">⛶</button>
                </div>
              </div>
            </div>
          </div>
          <aside class="side">
            <section class="card invite-card">
              <p class="room-name">Friday movie night</p>
              <span class="invite-label">Invite link</span>
              <div class="row"><input readonly value="screen-with-me.swm-server.workers.dev/r/k3x9q2" /><button type="button" class="btn primary">Copy</button></div>
            </section>
            <section class="card tabs-card">
              <nav class="tabs">
                <button type="button" class="tab" aria-selected="${tab === 'chat'}"><span>💬</span><span>Chat</span></button>
                <button type="button" class="tab" aria-selected="${tab === 'queue'}"><span>🎵</span><span>Queue</span><span class="count">2</span></button>
                <button type="button" class="tab" aria-selected="${tab === 'people'}"><span>👥</span><span class="count">${PEOPLE.length}</span></button>
                <button type="button" class="tab tab-icon" aria-selected="${tab === 'settings'}">⚙️</button>
              </nav>
              ${panels[tab]}
            </section>
          </aside>
        </div>`;

      if (view === 'strip') {
        document.body.insertAdjacentHTML(
          'afterbegin',
          `<div class="film-site">
            <header><span class="site-logo"><i></i>VideoSite</span><span>Home</span><span>Browse</span><span>My list</span></header>
            <main><div><div class="frame"><div class="film"><div class="sun"></div><div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div></div>
              <div class="play">▶</div><div class="cursor">👆</div></div>
              <h2>Sunset Hills · Part 3</h2><p>Nature documentary · 1 h 41 min</p></div>
              <aside><div></div><div></div><div></div><div></div></aside></main>
          </div>`,
        );
      }

      // Tema penceresi (themes.ts openThemeDialog ile aynı işaretleme)
      if (q.get('dialog') === 'theme') {
        const THEMES = [
          ['gece', 'Night', '#141936', '#8b6cff'], ['okyanus', 'Ocean', '#0b2a45', '#2ec5e8'], ['gunbatimi', 'Sunset', '#3a1530', '#ff7a4d'],
          ['neon', 'Neon', '#050508', '#ff2bd6'], ['ortacag', 'Fantasy medieval', '#1a1430', '#d6a843'], ['lokum', 'Turkish Delight', '#2a0e1e', '#f08cae'],
          ['binbirgece', 'Arabian Nights', '#141236', '#e8c27a'], ['sinema', 'Picture Palace', '#0d1020', '#e9b949'], ['opera', 'Opera Night', '#0f3638', '#e8708a'],
          ['acikhava', 'Drive-In', '#1a1340', '#ff8a6b'], ['gemi', 'Ocean Liner', '#24425e', '#ec6a5a'], ['tren', 'Night Express', '#0e1428', '#6fd6a8'],
        ];
        const SCENES = ['ortacag', 'lokum', 'binbirgece', 'sinema', 'opera', 'acikhava', 'gemi', 'tren'];
        const now = q.get('theme') || 'gece';
        document.body.insertAdjacentHTML(
          'beforeend',
          `<div class="dialog-backdrop shot"><div class="avatar-dialog theme-dialog card">
            <div class="dialog-head"><h3>Pick a theme (you see it right away behind this window)</h3><button type="button" class="icon-btn dialog-x">✕</button></div>
            <div class="theme-cards">${THEMES.map(([id, name, a, b]) => {
              const scene = SCENES.includes(id) ? `url('/themes/${id}.svg') center bottom / cover no-repeat, ` : '';
              return `<button type="button" class="theme-card" aria-checked="${id === now}" style="--chip-b: ${b}"><span class="theme-preview" style="background: ${scene}linear-gradient(160deg, ${a} 55%, ${b})"><img src="/themes/${id}-maskot.svg" alt=""></span><span class="theme-card-name">${name}</span></button>`;
            }).join('')}</div>
            <div class="dialog-foot"><button type="button" class="btn primary">Done</button></div>
          </div></div>`,
        );
      }
    </script>
  </body>
</html>
