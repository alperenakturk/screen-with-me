# Card OPS1: an uptime check of the live site every 30 minutes (scripts/monitor.mjs: the home page, /api/version and
# a tiny room join, a failure tried once more after a minute). When the site is down it opens one issue labelled
# `outage` (GitHub notifies the owner, no new account); while it stays down that issue's text is updated in place (an
# edit sends no new notification); the first green check closes it with a comment. Never more than one open issue.
name: Uptime

on:
  schedule:
    # Every 30 minutes; GitHub may start a scheduled run a few minutes late.
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    # Only the real repository checks the live site (never a fork).
    if: github.repository == 'alperenakturk/screen-with-me'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the live site
        id: check
        run: |
          if node scripts/monitor.mjs https://screen-with-me.swm-server.workers.dev --out "$RUNNER_TEMP/result.md"; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open, update or close the outage issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UP: ${{ steps.check.outputs.up }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --label outage --state open --json number --jq '.[0].number // empty')
          note="_Opened and closed by the uptime check (\`.github/workflows/monitor.yml\`, every 30 minutes). [This run]($RUN_URL)._"
          if [ "$UP" = true ]; then
            if [ -n "$open" ]; then
              { echo "Back up."; echo; cat "$RUNNER_TEMP/result.md"; echo "$note"; } > "$RUNNER_TEMP/body.md"
              gh issue close "$open" --comment "$(cat "$RUNNER_TEMP/body.md")"
            fi
            exit 0
          fi
          { echo "The live site failed its uptime check twice, a minute apart. Latest check:"; echo; cat "$RUNNER_TEMP/result.md"
            echo "What to look at: the last deploy in Actions, Cloudflare's dashboard (Workers → screen-with-me → Logs / Metrics) and https://www.cloudflarestatus.com."
            echo; echo "$note"; } > "$RUNNER_TEMP/body.md"
          if [ -n "$open" ]; then
            gh issue edit "$open" --body-file "$RUNNER_TEMP/body.md"
          else
            gh label create outage --color B60205 --description "The live site is down (uptime check)" 2>/dev/null || true
            gh issue create --title "Live site is down" --label outage --body-file "$RUNNER_TEMP/body.md"
          fi
          # The run itself stays green: a red scheduled run e-mails the owner every 30 minutes; the one issue is the signal.
          echo "::warning::The live site is down (see the outage issue)."
