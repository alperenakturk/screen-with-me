# On every push and PR: typecheck, unit tests, build; on a PR also end-to-end tests and browser harnesses against a
# local server, in parallel jobs (card CI2).
# The local server is `wrangler dev` (no account needed); e2e connects fake users to the real server code.
# On every push to main, if the tests pass, site + server are deployed to Cloudflare and e2e runs against
# live (deploy job). Can also be started by hand from the Actions tab ("Run workflow").
name: Tests

# CI diet (Nov 2026): the `changes` job decides what a change needs (docs-only: no tests; harnesses only when the site
# or the shared code changed); a new push to a PR cancels its older run. No `paths-ignore`: a required check must
# always report (a job skipped by its `if` reports success, a workflow never started leaves the check pending).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Card CI3: the nightly date sweep. Every test job runs on main's code with the browser pages' clock moved 1–60 days
  # ahead (a different day each night), so no test result depends on the day it runs; it never deploys.
  schedule:
    - cron: '17 2 * * *'

# The date sweep has its own group, so it never holds up (or is replaced by) a push to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'date-sweep' || github.event.pull_request.number || github.ref }}
  # Only PR runs are cancelled; a run on main always finishes (it deploys).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: the jobs only check out the code; deploys use the Cloudflare token (security review 2, L10).
permissions:
  contents: read

# Card CI3, the date sweep only: SWM_TEST_DAYS=sweep makes `.github/actions/prepare` load
# scripts/harness/forced-date.cjs into every later node process, which moves the clock of each browser page Playwright
# opens 1–60 days ahead (from the run number). Empty on every other run.
env:
  SWM_TEST_DAYS: ${{ github.event_name == 'schedule' && 'sweep' || '' }}

jobs:
  # What changed (scripts/ci-changes.mjs): `code` = anything besides docs (`docs/**`, `*.md`); `web` = the site, the
  # shared code, the harnesses or the workflows (the browser harnesses run only then). On main the range starts at the
  # last successful run on main, not at this push: the concurrency group keeps one pending run, so a newer push cancels
  # an older pending one, and a docs-only push after a cancelled code push must still test and deploy that code.
  # Card CI3 (release train): on main, wait until main has been quiet for 2 minutes, so PRs merged close together go
  # live in one deploy; a run that a newer merge overtakes cancels itself and the newer run takes its code along
  # (scripts/ci-settle.mjs). The only job with `actions: write` (to cancel its own run). It always runs and succeeds
  # (its steps do nothing outside a push): a skipped job here would skip every job after it, because a job's `if`
  # without a status function checks every job up its `needs` chain (it did, on #464's first run).
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          sparse-checkout: scripts
      - name: Wait for a quiet main
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-settle.mjs

  changes:
    needs: settle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      web: ${{ steps.diff.outputs.web }}
      tree: ${{ steps.diff.outputs.tree }}
      proven: ${{ steps.diff.outputs.proven }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the change detection and the workflow guards
        run: node --test scripts/ci-changes.test.mjs scripts/ci-settle.test.mjs scripts/harness/forced-date.test.cjs scripts/release.test.mjs scripts/keep-assets.test.mjs scripts/ci-workflow.test.mjs scripts/tag-live.test.mjs scripts/e2e/shard.test.mjs

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.mjs

      # Cards DOCS1 + DOCS2: CLAUDE.md, STATUS.md and CARDS.md stay small, and nothing of them is lost against the PR's
      # base (or the previous commit on main): every backticked identifier and card heading is still somewhere in docs/.
      # Here, not in `checks`, because a docs-only change skips `checks`.
      # Card CI3b: a PR carries no version (CI numbers every release when it goes live); its user-facing lines go into
      # changelog/next/<branch>.md. Here, not in `checks`, because a docs-only PR (CHANGELOG.md) skips `checks`.
      - name: No version set by hand
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: node scripts/check-version-edits.mjs "$BASE"

      - name: Docs stay small, nothing lost
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          node --test scripts/check-docs.test.mjs
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then node scripts/check-docs.mjs --against "$BASE"; else node scripts/check-docs.mjs; fi

  # Card CI2: the tests run as parallel jobs (a PR's single job had grown past 20 minutes): `checks` (typecheck, texts,
  # unit tests, build, size budget; push and PR), and on a PR only `e2e` (the local server's e2e + the help harness),
  # `site` (the site's browser harnesses) and `games` (games quality). Each builds the code itself (the shared start is
  # `.github/actions/prepare`). The job named `test` waits for all of them and is the ruleset's required check.
  checks:
    needs: changes
    # Docs-only: skipped, which reports as success for a required check.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Name check (Sidelit)
        run: node scripts/check-name.mjs

      # Card PWA1: the home-screen app's manifest (English, icons and screenshots at their sizes, shortcut, share target).
      - name: App manifest
        run: node scripts/check-manifest.mjs

      - name: The site's address comes from site.config.json only
        run: node scripts/check-domain.mjs

      - name: Text check (every string in English and Turkish)
        run: node scripts/check-texts.mjs

      # Card GT: every game's own text table has the same keys in English and Turkish.
      - name: Game texts (EN = TR keys)
        run: |
          node --test scripts/check-game-text.test.mjs
          node scripts/check-game-text.mjs apps/web/src/games apps/web/src/ui/report.ts apps/web/src/ui/vimeo-results.ts apps/web/src/ui/feed-window.ts

      # Card SB3: Snack Bar's balance (10 h of film: no strategy dominates, the first new cinema in time).
      - name: Snack Bar balance
        run: node --experimental-strip-types scripts/snack-sim.mjs --check

      - name: Unit tests
        run: npm test

      - name: Build (extension + site)
        run: npm run build

      - name: Room page size budget
        run: node scripts/size-budget.mjs

  # CI diet (a), owner's pick: on main the PR already ran the local suite on the same code, so a push to main runs only
  # `checks` before the deploy; the full e2e still runs against live after it. Card CI3: only when main's code is exactly
  # what a green PR run tested (`proven`); a combination no PR tested (two PRs merged without updating) runs every PR
  # test job here before the deploy.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || needs.changes.outputs.proven != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          server: 'true'

      - name: End-to-end tests
        env:
          SWM_E2E_UNPACED: '1'
          # lab-server.mjs: this server has the lab powers; the live run (no LAB_SERVER) checks they are refused.
          LAB_SERVER: '1'
          # lab-check.mjs: the right code gets a pass here; live has no such code, so only refusals are checked there.
          LAB_CODE: harness-lab-code
          # Card QA1: three files at a time on this unpaced local server (7.3 → 3.5 min); files that count per address or
          # for the whole server run alone after them (scripts/e2e/run.mjs `SOLO`). The live run stays one at a time.
          SWM_E2E_PARALLEL: '3'
        run: npm run e2e

      # Card UPTIME2: the Worker's own uptime cron, fired once on a second local server without a GitHub token: it must
      # find the built site healthy and only log.
      - name: Uptime cron (log only without a token)
        run: node scripts/check-uptime-cron.mjs 8791

      # Card MB: the help page and the privacy policy state the code's numbers (limits, retention, the upload budget,
      # the TV being off) in both languages; the room links them. Server constants count too, so not only on `web`.
      - name: Help page and policy numbers
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.63.0
          bash scripts/ci-playwright.sh
          node scripts/harness/help/run.cjs http://localhost:8787

      # Card SAFE1: "Block for me" hides a person for one viewer only (computer + phone), survives a reload and is undone;
      # "Report" sends the room, the shown name and their last lines (no id) and the Worker validates it.
      - name: Block for me and Report
        run: node scripts/harness/safety/run.cjs http://localhost:8787

      # Only its end: the whole log of every run buried the failing step's own output.
      - name: Server log (on failure)
        if: failure()
        run: tail -n 150 wrangler.log || true

  # The site's browser harnesses, only when the site, the shared code, the harnesses or the workflows changed.
  site:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || needs.changes.outputs.proven != 'true') && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          server: 'true'
          playwright: 'true'

      # Card A11y: axe-core (WCAG 2.1 A + AA) on home, help, join, room, settings, invite, games hall, tic-tac-toe and
      # the first tips, plus a keyboard tour.
      - name: Accessibility (axe + keyboard tour)
        run: node scripts/harness/a11y/run.cjs http://localhost:8787

      # Card FONT1: the Font setting (only the picked font downloads, Turkish letters, kept after a reload, Test Lab).
      - name: Font setting
        run: node scripts/harness/fonts/run.cjs http://localhost:8787

      # Card DL: the 🐞 Test Lab (drawer, command box, status, log, bug text) and that with it off nothing of it loads.
      - name: Test Lab
        run: |
          node scripts/harness/test-lab/run.cjs http://localhost:8787
          node scripts/harness/lab-friends/run.cjs http://localhost:8787
          node scripts/harness/lab-video/run.cjs http://localhost:8787
          node scripts/harness/lab-scenarios/run.cjs http://localhost:8787
          node scripts/harness/lab-lock/run.cjs harness-lab-code
          # Card LABTR: the same lab in Turkish (plain words, no English left, the command box finds Turkish words).
          LAB_LANG=tr node scripts/harness/test-lab/run.cjs http://localhost:8787
          LAB_LANG=tr node scripts/harness/lab-friends/run.cjs http://localhost:8787
          LAB_LANG=tr node scripts/harness/lab-video/run.cjs http://localhost:8787
          LAB_LANG=tr node scripts/harness/lab-scenarios/run.cjs http://localhost:8787

      # Card DL3a: the Test Lab's game tools (open any game, side-game cheats on a sandbox save, restore my real saves).
      - name: Test Lab games
        run: |
          node scripts/harness/lab-games/run.cjs http://localhost:8787
          LAB_LANG=tr node scripts/harness/lab-games/run.cjs http://localhost:8787

      # Card SZ: the room's lazy chunks are not downloaded with the room but warmed once it settles, and voice, streams
      # and watching fail closed when their chunks can't load (card SIMP1: no IP notice before them any more).
      - name: Lazy chunks and their gates
        run: node scripts/harness/lazy-gates/run.cjs http://localhost:8787

      # Card SIMP1: Settings in categories (phone, tablet, laptop, desktop; EN + TR), the calmer room and join screens.
      - name: Settings categories and a calmer room
        run: node scripts/harness/settings/run.cjs http://localhost:8787

      # Card PERF1a: only the page's language is downloaded (Turkish is its own chunk, in before the first frame).
      - name: One language per page
        run: node scripts/harness/lang-chunk/run.cjs http://localhost:8787

      # Card PERF1b: the room's styles (room.css) load only with the room, styled from its first frame.
      - name: Room styles only in the room
        run: node scripts/harness/room-css/run.cjs http://localhost:8787

      # Card OFFLINE2: a lazy chunk that fails while our site can't be reached (also with navigator.onLine true) waits
      # for the network instead of reloading into the browser's error page; a chunk gone after a deploy still reloads.
      - name: A failed chunk waits for the network
        run: node scripts/harness/offline-reload/run.cjs http://localhost:8787

      # BH13: the outdated-extension notice (the link's dot; the bubble waits for the first-time tips; none on a phone).
      - name: Outdated extension notice
        run: node scripts/harness/ext-update/run.cjs http://localhost:8787

      # Card R3-3: an older address of the site moves to the main one and carries the browser's saves once
      # (its own build with a two-address test config; no server needed).
      - name: Moving to an own domain
        run: node scripts/harness/domain-move/run.cjs

      # Card CAM1: cameras between a computer and a phone (both ways, the phone's camera row and sheet, switching in
      # place, the rear camera not mirrored, a stopped or paused picture recovering by itself).
      - name: Phone cameras
        run: node scripts/harness/cam-phone/run.cjs http://localhost:8787

      # Card LAB3: a phone held sideways (the first-time tips wait, an iPhone SE's empty room fits).
      - name: Phone held sideways
        run: node scripts/harness/phone-sideways/run.cjs http://localhost:8787

      # R27 + 0.9.97.129: the avatar picker is one fixed grid, and a pick never sends it back to the top.
      - name: Avatar picker
        run: node scripts/harness/avatar-picker/run.cjs http://localhost:8787

      # Card 15b + PWA1: the home page fits its first screen at every size (EN + TR), the iOS install hint included.
      - name: Home page
        run: node scripts/harness/home/run.cjs http://localhost:8787

      # Card SRC1: the ⠿ Sources picker (YouTube, Vimeo, search the web) on a computer (EN) and a phone (TR); Vimeo's
      # answers are stubbed in the browser, and without the secret the real route says "not available yet".
      - name: Sources picker
        run: node scripts/harness/sources/run.cjs http://localhost:8787

      # Card SH2: the room's feeds from the Queue (start, pause from a friend, steer, stop; YouTube faked).
      - name: Feeds from the Queue
        run: node scripts/harness/feed/run.cjs http://localhost:8787

      # Card CH1: a long chat stays (500 lab messages), pages back in on scroll-up, and room activity never pushes it out.
      - name: Chat kept until the room is deleted
        run: node scripts/harness/chat-history/run.cjs http://localhost:8787

      # Card SH1 (1): after "↩ Room view" a playing Short offers "📱 Shorts view" (phone: the Room tab's strip; computer:
      # beside Next), and it works again and again. Needs YouTube.
      - name: Shorts view way back
        run: node scripts/harness/shorts-back/run.cjs http://localhost:8787

      - name: Server log (on failure)
        if: failure()
        run: tail -n 150 wrangler.log || true

  # Card BHG: every game fits its window (no inner scrollbar, text >= 13 px, nothing cut off, a fair-sized board) on a
  # laptop and a phone in English and Turkish (the four sizes locally: drop SIZES), and minimize / restore / a reload
  # mid-game keep the game (Classics, Quiz, Draw & Guess, side games); Sea Battle with two people and Glowbeam; the
  # tablet layouts with a game window beside the chat.
  games:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || needs.changes.outputs.proven != 'true') && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          server: 'true'
          playwright: 'true'

      - name: Games sweep (laptop + iPhone, EN + TR; window sizes and fullscreen)
        # Card GW: the window passes (smallest, largest, fullscreen) in Turkish only, to keep this job near the others.
        run: SIZES=laptop,iphone GW_LANGS=tr node scripts/harness/games-sweep/run.cjs http://localhost:8787

      - name: Games resume, Sea Battle, How to play, result card
        run: |
          node scripts/harness/games-resume/run.cjs http://localhost:8787
          node scripts/harness/sea/run.cjs http://localhost:8787
          # GP2: the tables' How to play cards (first time, the "?", per Classics board, Turkish).
          node scripts/harness/table-how/run.cjs http://localhost:8787
          # 0.9.97.128: on a phone the head's ⋯ sheet (Leave / Close table) sits above every table's lobby.
          node scripts/harness/game-more/run.cjs http://localhost:8787
          # GP2: the one result card (Classics; Sea's in the sea harness) and Glowbeam the referee's reactions.
          node scripts/harness/game-result/run.cjs http://localhost:8787
          # BH13-G: two people at a table, a reload and a network drop mid-game (a subset; locally every table).
          OFFLINE_CHUNK=1 BOARDS=dama,backgammon TABLES=sea,duel,poker,quiz node scripts/harness/games-pair/run.cjs http://localhost:8787

      - name: Server log (on failure)
        if: failure()
        run: tail -n 150 wrangler.log || true

  # The second half of the games (0.9.97.106: one job passed its 20 minutes on a slow runner): games beside a YouTube
  # video, the tablets, Snack Bar and motion. Same gate as `games`; the two stay about equal.
  games-more:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || needs.changes.outputs.proven != 'true') && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          server: 'true'
          playwright: 'true'

      # Card YTG: over a YouTube video a game's window stays clear of the player (three sizes, a drag, fullscreen).
      - name: Games beside a YouTube video
        run: node scripts/harness/games-youtube/run.cjs http://localhost:8787

      # Card GT: on a tablet (iPad + Android, upright and sideways) a game's window stays clear of the chat.
      - name: Tablets
        run: |
          bash scripts/ci-test-video.sh
          node scripts/harness/tablet/run.cjs http://localhost:8787 http://localhost:5300/video.webm
      # 0.9.97.137: the Snack Bar's daily special never makes a row taller or the game smaller (each stand forced to be
      # the special by the page's day, upright Android tablet): CI no longer depends on the day it runs.
      - name: Snack Bar daily special
        run: node scripts/harness/snack-special/run.cjs http://localhost:8787 http://localhost:5300/video.webm
      # Card GP1: every game opens with one click on its card, Classics and Snack Bar in ≤ 300 ms (hall open, CI machine).
      - name: Games open at once
        run: node scripts/harness/game-open/run.cjs http://localhost:8787

      # Lane W: the game window's head and free window (W1–W5, 0.9.97.112–114): no ⛶, 🎮 opens the hall, drag / resize /
      # each game's own spot, never over a YouTube player, side games only in the free window, a table pausing the video
      # (needs the webm the Tablets step serves on :5300).
      - name: Game window head
        run: node scripts/harness/game-window-head/run.cjs http://localhost:8787 http://localhost:5300/video.webm

      - name: Games sweep on a 360 × 640 phone (the Games tab, EN + TR)
        # PH2: every game fits a small phone's Games tab unscaled (13 px text, 44 px targets), running tables included.
        run: SIZES=small GW_LANGS=none node scripts/harness/games-sweep/run.cjs http://localhost:8787

      - name: Snack Bar and Five Frames whole on a laptop and a sideways tablet (EN + TR)
        # 0.9.97.134 (B2): no text ends in "…" and the SNACK BAR sign is whole, idle and at its busiest.
        # GP1: Five Frames keeps its 13 px text in the sideways tablet's short window (its compact tier, not a scale-down).
        run: GAMES=snack,snackBusy,word SIZES=laptop,tabland GW_LANGS=none node scripts/harness/games-sweep/run.cjs http://localhost:8787

      # Card PWA1: the home-screen app (share target → a new room that plays the link, "Create room" shortcut, the screen
      # kept on while playing, the one-time iOS hint). Here for the webm the Tablets step serves on :5300.
      - name: Home-screen app
        run: |
          node scripts/harness/pwa/run.cjs http://localhost:8787 http://localhost:5300/video.webm
          # GS QA1 finding 3: chat messages over the video keep clear of an open game window.
          node scripts/harness/toast-game/run.cjs http://localhost:8787 http://localhost:5300/video.webm
          # Card UI2: the rail's ⋯ has one speed row and a picker (ready speeds, − / +), and the speed reaches everyone.
          node scripts/harness/rail-speed/run.cjs http://localhost:8787 http://localhost:5300/video.webm

      - name: Snack Bar and motion
        run: |
          # Card SB3: Snack Bar's economy (migration, buy modes, upgrades, staff, eight stands, new places).
          node scripts/harness/snack-bar-3/run.cjs http://localhost:8787
          # Card NG2: place colours, the seasonal stand, the manager's report, a stand's own milestone sound.
          node scripts/harness/snack-bar-ng2/run.cjs http://localhost:8787
          # Card NG3: the window slides in, chess pieces slide, nothing moves under "reduce motion".
          node scripts/harness/motion/run.cjs http://localhost:8787
          # BUG6: a word game (Five Frames, the Duel) takes the keyboard as it opens; the chat keeps its own keys.
          node scripts/harness/word-focus/run.cjs http://localhost:8787
          # WG2: Window Garden keeps still while you play (no button moves); views, pot colours, compost.
          node scripts/harness/garden-steady/run.cjs http://localhost:8787

      # Card LAB2: every 🎮 Test Lab command runs (a computer in English, a phone in Turkish), the 🤖 friend at a table.
      - name: "Test Lab games: every command, the table friend"
        run: |
          ONLY=laptop-en,phone-tr node scripts/harness/lab-games-all/run.cjs http://localhost:8787
          node scripts/harness/lab-table-friend/run.cjs http://localhost:8787
          # QZ2: a Quiz answer registers on the first press, even while other players' answers stream in.
          node scripts/harness/quiz-click/run.cjs http://localhost:8787

      - name: Server log (on failure)
        if: failure()
        run: tail -n 150 wrangler.log || true

  # Card QA1: the game windows' own job (game-proportions alone took 6.5 of games-more's 12.5 min).
  game-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || needs.changes.outputs.proven != 'true') && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          server: 'true'
          playwright: 'true'

      # Card PROP: every game well proportioned in the video's place and the free window (laptop, desktop, tablet).
      - name: Game proportions
        run: SIZES=laptop,desktop,tablet node scripts/harness/game-proportions/run.cjs http://localhost:8787

      # Card CI3: the state matrix runs here, after the proportions (one runner instead of two; ≈ 11 min together).
      - name: Game windows in every state
        run: |
          bash scripts/ci-test-video.sh
          HEADFUL=1 FILM_URL=http://localhost:5300/video.webm xvfb-run -a node scripts/harness/state-matrix/run.cjs http://localhost:8787

      - name: Server log (on failure)
        if: failure()
        run: tail -n 150 wrangler.log || true

  # Card QA1: the theme contrast check is its own job (5.5 of the site job's 12 min; the site job was the longest).
  contrast:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || needs.changes.outputs.proven != 'true') && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          server: 'true'
          playwright: 'true'

      # Card THEME1: every theme's text passes WCAG AA against the real pixels behind it (scene pictures included):
      # home (1366 and 1920), help, join card, room, settings and the games hall; phones the plain themes.
      - name: Theme contrast (WCAG AA)
        run: node scripts/harness/contrast/run.cjs http://localhost:8787

      # Card CI3: the Test Lab sweep runs here, after the contrast check (one runner instead of two; ≈ 11 min together).
      - name: Test Lab sweep
        run: |
          DEVICES=laptop LANGS=en node scripts/harness/lab-sweep/run.cjs harness-lab-code
          DEVICES=phone LANGS=tr node scripts/harness/lab-sweep/run.cjs harness-lab-code

      - name: Server log (on failure)
        if: failure()
        run: tail -n 150 wrangler.log || true

  # The ruleset's required check: green when every test job passed or was skipped on purpose (docs-only, a push to
  # main, no site change); red when one failed or was cancelled, or the change detection itself failed. `always()`, so
  # a failed job can never make this one "skipped" (which a required check would count as success).
  test:
    needs: [changes, checks, e2e, site, contrast, games, games-more, game-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All test jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CHECKS: ${{ needs.checks.result }}
          RESULTS: ${{ needs.checks.result }} ${{ needs.e2e.result }} ${{ needs.site.result }} ${{ needs.contrast.result }} ${{ needs.games.result }} ${{ needs.games-more.result }} ${{ needs.game-windows.result }}
        run: |
          echo "changes: $CHANGES · checks, e2e, site, contrast (+ Test Lab sweep), games, games-more, game-windows (+ state matrix): $RESULTS"
          [ "$CHANGES" = success ] || { echo "::error::The change detection did not succeed."; exit 1; }
          # CI3: code changed, so `checks` must have run; a skip here means a job up the chain skipped them all.
          [ "$CODE" != true ] || [ "$CHECKS" = success ] || { echo "::error::Code changed but checks ended as $CHECKS."; exit 1; }
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A test job ended as $r."; exit 1 ;; esac
          done

      # Card CI3 (release train): every test job passed on this PR, so this exact code is tested. A tiny cache named
      # after the code's fingerprint (ci-changes.mjs `tree`: every code file, docs left out) tells main's run so; main
      # skips the PR test jobs only when it finds its own fingerprint here (`proven`).
      - name: Remember the tested code
        if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: mkdir -p .tested && echo "$TREE" > .tested/tree
      - name: Save the tested code's mark
        if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tested
          key: tested-code-${{ needs.changes.outputs.tree }}

  # Deploy to live: only on main and only if the tests passed. Cloudflare keys are in the repo's
  # Secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID); without them the job warns and skips.
  deploy:
    needs: [changes, test]
    # Docs-only pushes to main deploy nothing (the test jobs were skipped). A status function is needed (CI2): without one
    # the `if` gets an implicit `success()`, which looks at every job up the chain, and a push skips e2e / site / games,
    # so the deploy was skipped too. `!cancelled()` (not `always()`) keeps a cancelled run from deploying; the explicit
    # `needs.test.result` keeps "deploy only when the tests passed".
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.changes.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'schedule' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # Card QA1 part 1b: the live e2e is its own job (`live-e2e`, three shards); this one deploys and waits for the version.
    timeout-minutes: 15
    # Security R4-5: the deploy runs in the `production` environment. Its secrets (Cloudflare, YouTube, feedback, usage)
    # can live there instead of the repository, so no other job or branch can read them. Repository secrets still reach
    # it until the owner moves them; GitHub creates the environment on first use if it doesn't exist yet.
    environment: production
    # CI3c: `actions: read` lists the released-number records (scripts/release-version.mjs); no write.
    permissions:
      contents: read
      actions: read
    # Card OPS1 / QA1: `deployed` is true only when this run deployed and the new version answers; the live e2e
    # (`live-e2e`) and the `tag` job read it.
    outputs:
      deployed: ${{ steps.deployed.outputs.ok }}
      # Card CI3b: the number this run gave the release (footer + extension); the `tag` job tags it.
      version: ${{ steps.number.outputs.version }}
    # Two quick pushes must not deploy at the same time; the next one waits.
    concurrency:
      group: deploy
      cancel-in-progress: false
    # Secrets live only on the steps that need them (security review 3, R3-2): never in the environment of `npm ci`
    # (install scripts) or the build. This step only says whether the Cloudflare keys exist.
    steps:
      - name: Check keys
        id: keys
        env:
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAVE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAVE_TOKEN" = true ] && [ "$HAVE_ACCOUNT" = true ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are missing, deploy skipped."; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.keys.outputs.ok == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.keys.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm

      # Card CI3b: CI numbers every release: the series in release-series.txt + the highest tag's fourth part + 1, written
      # into the footer and the extension of this checkout before the build (never committed). Untagged until the live
      # e2e passes, so a failed run's number is given again by the next run.
      - name: Number this release
        id: number
        if: steps.keys.outputs.ok == 'true'
        env:
          # Lists the `released-<version>` records (actions: read); nothing else.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-version.mjs --apply

      - name: Install and build
        if: steps.keys.outputs.ok == 'true'
        run: |
          npm ci
          npm run build
          # R3-2 guard: no deploy secret may be in this step's environment.
          if env | grep -qE '^(CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|YOUTUBE_API_KEY|VIMEO_TOKEN|FEEDBACK_GITHUB_TOKEN|USAGE_TOKEN|LAB_CODE)='; then
            echo "::error::A deploy secret is in the install / build environment."; exit 1
          fi

      # Card GR1: a tab opened before this deploy keeps loading its lazy chunks (a game, a panel) after it: the earlier
      # builds' hashed files are copied from the live site into dist/assets and served for 7 more days. Without this a
      # missing chunk got the index.html fallback and the page reloaded mid-room. Never fails the deploy.
      - name: Keep earlier builds' files for open tabs
        if: steps.keys.outputs.ok == 'true'
        run: node scripts/keep-assets.mjs "$(node scripts/site-config.mjs origin)"

      - name: Deploy to Cloudflare
        if: steps.keys.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # YouTube search in the link box (optional): uploaded as a Worker secret with every deploy.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Card SRC1 (optional): Vimeo search in the ⠿ Sources picker (an unauthenticated app token, scope public);
          # uploaded as a Worker secret like the YouTube key. Without it the Vimeo tile says "not available yet".
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          # "Send feedback" (card 9, optional): a fine-grained token, Issues: write on this repository only. Only this
          # step sees it (security review 3 R3-2); it goes to the Worker as a secret like the YouTube key.
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          # Privacy card (0.9.97.60): the PRIVATE repository the feedback issues go to (owner/name), a repository variable
          # (Settings → Secrets and variables → Actions → Variables). Without it feedback answers 'off': this repository
          # is public and a reply address must never become a public issue.
          FEEDBACK_REPO: ${{ vars.FEEDBACK_REPO }}
          # Card Y3 (optional): the owner's key for GET /api/youtube/usage (header X-Usage-Token); without it the route
          # is refused.
          USAGE_TOKEN: ${{ secrets.USAGE_TOKEN }}
          # Card LABLOCK (optional): the owner's code that opens the 🐞 Test Lab on the live site; without it the lab stays
          # shut there (local servers open it without a code).
          LAB_CODE: ${{ secrets.LAB_CODE }}
        run: |
          set -o pipefail
          [ -n "$YOUTUBE_API_KEY" ] || echo "::warning::YOUTUBE_API_KEY is missing, YouTube search stays off."
          [ -n "$FEEDBACK_GITHUB_TOKEN" ] && [ -n "$FEEDBACK_REPO" ] || echo "::warning::FEEDBACK_GITHUB_TOKEN or the FEEDBACK_REPO variable is missing, feedback answers 'off'."
          [ -n "$LAB_CODE" ] || echo "::warning::LAB_CODE is missing, the Test Lab stays shut on the live site."
          [ -n "$VIMEO_TOKEN" ] || echo "::warning::VIMEO_TOKEN is missing, Vimeo search says 'not available yet'."
          if [ -n "$YOUTUBE_API_KEY$VIMEO_TOKEN$FEEDBACK_GITHUB_TOKEN$FEEDBACK_REPO$USAGE_TOKEN$LAB_CODE" ]; then
            # The keys go from the environment into a temporary file outside the repo, never into the log; only the
            # ones that are set (an empty value would overwrite a working secret).
            node -e 'const e = process.env, s = {}; for (const k of ["YOUTUBE_API_KEY", "VIMEO_TOKEN", "FEEDBACK_GITHUB_TOKEN", "FEEDBACK_REPO", "USAGE_TOKEN", "LAB_CODE"]) if (e[k]) s[k] = e[k]; require("fs").writeFileSync(process.argv[1], JSON.stringify(s))' "$RUNNER_TEMP/secrets.json"
            npm run deploy -w @swm/server -- --secrets-file "$RUNNER_TEMP/secrets.json" | tee "$RUNNER_TEMP/deploy.log"
            rm -f "$RUNNER_TEMP/secrets.json"
          else
            npm run deploy -w @swm/server | tee "$RUNNER_TEMP/deploy.log"
          fi
          # The new version's id, for the live e2e's wait below.
          echo "SWM_VERSION=$(grep -oE 'Current Version ID: [0-9a-f-]+' "$RUNNER_TEMP/deploy.log" | awk '{print $4}')" >> "$GITHUB_ENV"

      - name: Wait for the new version
        if: steps.keys.outputs.ok == 'true'
        run: |
          # The new version takes a minute or two to spread, and objects started on the old code restart later (closing
          # their connections mid-test). Wait until the Worker and a Durable Object both answer with the new id.
          # The address comes from site.config.json (card R3-3).
          SITE="$(node scripts/site-config.mjs origin)"
          if [ -n "$SWM_VERSION" ]; then
            node scripts/wait-live.mjs "$SITE" "$SWM_VERSION"
          else
            echo "::warning::No version id in the deploy output; waiting 30 s instead."
            sleep 30
          fi
          # Card R3-3: the main address and every alias answer, og:image and /domain.js name the main address.
          node scripts/check-domain.mjs --live

      - name: Mark the version deployed
        id: deployed
        if: steps.keys.outputs.ok == 'true'
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  # Card QA1 part 1b: the e2e against live, in shards on separate runners (three since CI3: 7.4 min → ≈ 5 per release). The live server lets one address open 60
  # room connections a minute, so one runner had to pace the whole suite (13 min); each shard has its own address
  # (`SWM_E2E_SHARD`, scripts/e2e/shard.mjs balances them by their measured live time). No deploy can start under them:
  # the workflow's concurrency group runs main's runs one after another and never cancels one.
  live-e2e:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    # 25 before the split for the whole suite (a file's retry included); a shard is a third of it.
    timeout-minutes: 12
    environment: production
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: End-to-end tests against live
        env:
          # Card Y3: search.mjs reads the usage counters with the owner's key when it is set.
          USAGE_TOKEN: ${{ secrets.USAGE_TOKEN }}
          SWM_E2E_SHARD: ${{ matrix.shard }}/3
        run: npm run e2e -- "$(node scripts/site-config.mjs ws)"

  # Card OPS1 / TAG1: every version that went live gets a tag `v<version>` (the extension's version, the same number as
  # the site's footer), made by scripts/tag-live.mjs: this run's version at this run's commit, plus a catch-up for an
  # earlier live version that has no tag yet. The only job that may write to the repository, and only tags:
  # `contents: write` lives here alone (security R4-5), `actions: read` lets it see which commits deployed, and there is
  # no `workflows` permission on purpose: a tag the token may not make (main's workflow files changed since that commit)
  # becomes a warning with the owner's steps, never a red run. A version deployed again keeps its first tag.
  # TAG2: the optional secret TAG_TOKEN (fine-grained, this repository only: Contents + Workflows read and write) makes
  # those tags too, and the catch-up then back-fills the ones missed; only this step sees it.
  tag:
    needs: [deploy, live-e2e]
    # !cancelled() for the same reason as deploy's: skipped test jobs up the chain must not skip the tag. Live = deployed
    # and every live e2e shard passed (QA1 part 1b).
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true' && needs.live-e2e.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag the live versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_TOKEN: ${{ secrets.TAG_TOKEN }}
          RELEASE_VERSION: ${{ needs.deploy.outputs.version }}
        run: node scripts/tag-live.mjs

      # CI3c: record the number as released (it is live and its live e2e passed), whether or not the tag push worked:
      # the next deploy counts it (scripts/release-version.mjs), so a refused tag never makes a number come back.
      - name: Record the released number
        if: needs.deploy.outputs.version != ''
        env:
          VERSION: ${{ needs.deploy.outputs.version }}
        run: mkdir -p .released && echo "$VERSION $GITHUB_SHA" > .released/version
      - name: Save the released number's record
        if: needs.deploy.outputs.version != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .released
          key: released-${{ needs.deploy.outputs.version }}

      # Card CI3b: the release's notes, from the changelog/next/ files added since the previous tag (user-facing English,
      # one block), as a GitHub release on the tag. CI3c: when the tag is missing (refused), the release is made on this
      # commit instead, and if that is refused too the notes go into the run's summary. Never red.
      - name: Release notes
        if: needs.deploy.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          git fetch --quiet --tags origin
          node scripts/changelog.mjs notes "$VERSION" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          { echo "## Release v$VERSION"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"
          if gh release view "v$VERSION" >/dev/null 2>&1; then exit 0; fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag || echo "::warning::The release v$VERSION could not be created; its notes are in this run's summary."
          else
            gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" || echo "::warning::v$VERSION has no tag and no release (refused); its notes are in this run's summary, its number is recorded."
          fi

  # Card CI3: the date sweep's result as an issue (label `date-sweep`): opened when a night fails, with the forced date;
  # closed by the next green night. Nobody has to watch the Actions tab.
  date-sweep:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.repository == 'alperenakturk/screen-with-me' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the date-sweep issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          days=$(( 1 + (RUN_NUMBER * 7) % 60 ))
          day=$(date -u -d "+${days} days" +%F)
          gh label create date-sweep --color FBCA04 --description "A test result depends on the date (nightly date sweep)" --force >/dev/null
          open=$(gh issue list --label date-sweep --state open --json number --jq '.[0].number // empty')
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then gh issue close "$open" --comment "Green again with the pages on ${day}. [This run]($RUN_URL)."; fi
            exit 0
          fi
          body="The nightly date sweep failed with the browser pages on **${day}** (${days} days ahead; card CI3): a test result depends on the date. Find the failing check in [this run]($RUN_URL); to run it locally on that day: \`SWM_TEST_DATE=${day} NODE_OPTIONS=\"--require \$PWD/scripts/harness/forced-date.cjs\" node scripts/harness/<name>/run.cjs ...\`. A harness that needs a given day sets its own clock (see \`scripts/harness/snack-special/run.cjs\`)."
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --label date-sweep --title "Date sweep failed: a test depends on the date" --body "$body"; fi
