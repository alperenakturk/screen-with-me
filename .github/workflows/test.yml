# Her push ve PR'da: tip kontrolü, birim testleri, derleme ve yerel sunucuyla uçtan uca testler.
# Yerel sunucu `wrangler dev` (hesap gerekmez); e2e sahte kullanıcılarla gerçek sunucu koduna bağlanır.
# main'e gelen her push'ta testler geçerse site + sunucu Cloudflare'e yüklenir ve canlıda e2e koşar
# (deploy işi). Actions sekmesinden "Run workflow" ile elle de çalıştırılabilir.
name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Birim testleri
        run: npm test

      - name: Derleme (eklenti + site)
        run: npm run build

      - name: Yerel sunucuyu başlat
        working-directory: apps/server
        run: |
          npx wrangler dev --port 8787 > ../../wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8787/ > /dev/null; then echo "sunucu hazır"; exit 0; fi
            sleep 1
          done
          echo "sunucu açılmadı"; cat ../../wrangler.log; exit 1

      - name: Uçtan uca testler
        run: npm run e2e

      - name: Sunucu kaydı (hata olursa)
        if: failure()
        run: cat wrangler.log || true

  # Canlıya yükleme: sadece main'de ve testler geçtiyse. Cloudflare anahtarları repo ayarlarındaki
  # Secrets'ta (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID); yoksa iş uyarı verip atlanır.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Art arda iki push gelirse yüklemeler çakışmasın; sıradaki beklesin.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Anahtarlar var mı?
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID eklenmemiş, canlıya yükleme atlandı."

      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''

      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 24
          cache: npm

      - name: Kurulum ve derleme
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npm ci
          npm run build

      - name: Cloudflare'e yükle
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run deploy -w @swm/server

      - name: Canlıda uçtan uca testler
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          # Yeni sürümün yayılması (ve nesnelerin yeni kodla yeniden başlaması) bir-iki dakika sürebilir.
          sleep 30
          npm run e2e -- wss://screen-with-me.swm-server.workers.dev
