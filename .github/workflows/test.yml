# On every push and PR: typecheck, unit tests, build; on a PR also end-to-end tests and browser harnesses against a
# local server, in parallel jobs (card CI2).
# The local server is `wrangler dev` (no account needed); e2e connects fake users to the real server code.
# On every push to main, if the tests pass, site + server are deployed to Cloudflare and e2e runs against
# live (deploy job). Can also be started by hand from the Actions tab ("Run workflow").
name: Tests

# CI diet (Nov 2026): the `changes` job decides what a change needs (docs-only: no tests; harnesses only when the site
# or the shared code changed); a new push to a PR cancels its older run. No `paths-ignore`: a required check must
# always report (a job skipped by its `if` reports success, a workflow never started leaves the check pending).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs are cancelled; a run on main always finishes (it deploys).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: the jobs only check out the code; deploys use the Cloudflare token (security review 2, L10).
permissions:
  contents: read

jobs:
  # What changed (scripts/ci-changes.mjs): `code` = anything besides docs (`docs/**`, `*.md`); `web` = the site, the
  # shared code, the harnesses or the workflows (the browser harnesses run only then). On main the range starts at the
  # last successful run on main, not at this push: the concurrency group keeps one pending run, so a newer push cancels
  # an older pending one, and a docs-only push after a cancelled code push must still test and deploy that code.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the change detection and the workflow guards
        run: node --test scripts/ci-changes.test.mjs scripts/ci-workflow.test.mjs scripts/tag-live.test.mjs

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.mjs

  # Card CI2: the tests run as parallel jobs (a PR's single job had grown past 20 minutes): `checks` (typecheck, texts,
  # unit tests, build, size budget; push and PR), and on a PR only `e2e` (the local server's e2e + the help harness),
  # `site` (the site's browser harnesses) and `games` (games quality). Each builds the code itself (the shared start is
  # `.github/actions/prepare`). The job named `test` waits for all of them and is the ruleset's required check.
  checks:
    needs: changes
    # Docs-only: skipped, which reports as success for a required check.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Name check (Sidelit)
        run: node scripts/check-name.mjs

      - name: The site's address comes from site.config.json only
        run: node scripts/check-domain.mjs

      - name: Text check (every string in English and Turkish)
        run: node scripts/check-texts.mjs

      # Card GT: every game's own text table has the same keys in English and Turkish.
      - name: Game texts (EN = TR keys)
        run: |
          node --test scripts/check-game-text.test.mjs
          node scripts/check-game-text.mjs

      - name: Unit tests
        run: npm test

      - name: Build (extension + site)
        run: npm run build

      - name: Room page size budget
        run: node scripts/size-budget.mjs

  # CI diet (a), owner's pick: on main the PR already ran the local suite on the same code, so a push to main runs only
  # `checks` before the deploy; the full e2e still runs against live after it.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          server: 'true'

      - name: End-to-end tests
        env:
          SWM_E2E_UNPACED: '1'
          # lab-server.mjs: this server has the lab powers; the live run (no LAB_SERVER) checks they are refused.
          LAB_SERVER: '1'
          # lab-check.mjs: the right code gets a pass here; live has no such code, so only refusals are checked there.
          LAB_CODE: harness-lab-code
        run: npm run e2e

      # Card MB: the help page and the privacy policy state the code's numbers (limits, retention, the upload budget,
      # the TV being off) in both languages; the room links them. Server constants count too, so not only on `web`.
      - name: Help page and policy numbers
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/harness/help/run.cjs http://localhost:8787

      # Only its end: the whole log of every run buried the failing step's own output.
      - name: Server log (on failure)
        if: failure()
        run: tail -n 150 wrangler.log || true

  # The site's browser harnesses, only when the site, the shared code, the harnesses or the workflows changed.
  site:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'push' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          server: 'true'
          playwright: 'true'

      # Card A11y: axe-core (WCAG 2.1 A + AA) on home, help, join, room, settings, invite, games hall, tic-tac-toe and
      # the first tips, plus a keyboard tour.
      - name: Accessibility (axe + keyboard tour)
        run: node scripts/harness/a11y/run.cjs http://localhost:8787

      # Card DL: the 🐞 Test Lab (drawer, command box, status, log, bug text) and that with it off nothing of it loads.
      - name: Test Lab
        run: |
          node scripts/harness/test-lab/run.cjs http://localhost:8787
          node scripts/harness/lab-friends/run.cjs http://localhost:8787
          node scripts/harness/lab-video/run.cjs http://localhost:8787
          node scripts/harness/lab-scenarios/run.cjs http://localhost:8787
          node scripts/harness/lab-lock/run.cjs harness-lab-code
          # Card LABTR: the same lab in Turkish (plain words, no English left, the command box finds Turkish words).
          LAB_LANG=tr node scripts/harness/test-lab/run.cjs http://localhost:8787
          LAB_LANG=tr node scripts/harness/lab-friends/run.cjs http://localhost:8787
          LAB_LANG=tr node scripts/harness/lab-video/run.cjs http://localhost:8787
          LAB_LANG=tr node scripts/harness/lab-scenarios/run.cjs http://localhost:8787

      # Card DL3a: the Test Lab's game tools (open any game, side-game cheats on a sandbox save, restore my real saves).
      - name: Test Lab games
        run: |
          node scripts/harness/lab-games/run.cjs http://localhost:8787
          LAB_LANG=tr node scripts/harness/lab-games/run.cjs http://localhost:8787

      # Card SZ: the room's lazy chunks are not downloaded with the room but warmed once it settles, and the IP notice
      # (a privacy gate) fails closed when its chunk can't load: no voice, stream or watching goes out.
      - name: Lazy chunks and their gates
        run: node scripts/harness/lazy-gates/run.cjs http://localhost:8787

      # Card PERF1a: only the page's language is downloaded (Turkish is its own chunk, in before the first frame).
      - name: One language per page
        run: node scripts/harness/lang-chunk/run.cjs http://localhost:8787

      # Card PERF1b: the room's styles (room.css) load only with the room, styled from its first frame.
      - name: Room styles only in the room
        run: node scripts/harness/room-css/run.cjs http://localhost:8787

      # Card OFFLINE2: a lazy chunk that fails while our site can't be reached (also with navigator.onLine true) waits
      # for the network instead of reloading into the browser's error page; a chunk gone after a deploy still reloads.
      - name: A failed chunk waits for the network
        run: node scripts/harness/offline-reload/run.cjs http://localhost:8787

      # BH13: the outdated-extension notice (the link's dot; the bubble waits for the first-time tips; none on a phone).
      - name: Outdated extension notice
        run: node scripts/harness/ext-update/run.cjs http://localhost:8787

      # Card R3-3: an older address of the site moves to the main one and carries the browser's saves once
      # (its own build with a two-address test config; no server needed).
      - name: Moving to an own domain
        run: node scripts/harness/domain-move/run.cjs

      # Card CAM1: cameras between a computer and a phone (both ways, the phone's camera row and sheet, switching in
      # place, the rear camera not mirrored, a stopped or paused picture recovering by itself).
      - name: Phone cameras
        run: node scripts/harness/cam-phone/run.cjs http://localhost:8787

      - name: Server log (on failure)
        if: failure()
        run: tail -n 150 wrangler.log || true

  # Card BHG: every game fits its window (no inner scrollbar, text >= 13 px, nothing cut off, a fair-sized board) on a
  # laptop and a phone in English and Turkish (the four sizes locally: drop SIZES), and minimize / restore / a reload
  # mid-game keep the game (Classics, Quiz, Draw & Guess, side games); Sea Battle with two people and Glowbeam; the
  # tablet layouts with a game window beside the chat.
  games:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'push' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          server: 'true'
          playwright: 'true'

      - name: Games sweep (laptop + iPhone, EN + TR; window sizes and fullscreen)
        # Card GW: the window passes (smallest, largest, fullscreen) in Turkish only, to keep this job near the others.
        run: SIZES=laptop,iphone GW_LANGS=tr node scripts/harness/games-sweep/run.cjs http://localhost:8787

      - name: Games resume, Sea Battle, How to play, result card
        run: |
          node scripts/harness/games-resume/run.cjs http://localhost:8787
          node scripts/harness/sea/run.cjs http://localhost:8787
          # GP2: the tables' How to play cards (first time, the "?", per Classics board, Turkish).
          node scripts/harness/table-how/run.cjs http://localhost:8787
          # GP2: the one result card (Classics; Sea's in the sea harness) and Glowbeam the referee's reactions.
          node scripts/harness/game-result/run.cjs http://localhost:8787
          # BH13-G: two people at a table, a reload and a network drop mid-game (a subset; locally every table).
          OFFLINE_CHUNK=1 BOARDS=dama,backgammon TABLES=sea,poker,quiz node scripts/harness/games-pair/run.cjs http://localhost:8787

      # Card YTG: over a YouTube video a game's window stays clear of the player (three sizes, a drag, fullscreen).
      - name: Games beside a YouTube video
        run: node scripts/harness/games-youtube/run.cjs http://localhost:8787

      # Card GT: on a tablet (iPad + Android, upright and sideways) a game's window stays clear of the chat.
      - name: Tablets
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          mkdir -p /tmp/vid && ffmpeg -loglevel error -f lavfi -i testsrc2=size=640x360:rate=24 -t 120 -c:v libvpx -b:v 300k /tmp/vid/video.webm
          (cd /tmp/vid && python3 -m http.server 5300 >/dev/null 2>&1 &)
          sleep 1
          node scripts/harness/tablet/run.cjs http://localhost:8787 http://localhost:5300/video.webm

      - name: Server log (on failure)
        if: failure()
        run: tail -n 150 wrangler.log || true

  # The ruleset's required check: green when every test job passed or was skipped on purpose (docs-only, a push to
  # main, no site change); red when one failed or was cancelled, or the change detection itself failed. `always()`, so
  # a failed job can never make this one "skipped" (which a required check would count as success).
  test:
    needs: [changes, checks, e2e, site, games]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All test jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ needs.checks.result }} ${{ needs.e2e.result }} ${{ needs.site.result }} ${{ needs.games.result }}
        run: |
          echo "changes: $CHANGES · checks, e2e, site, games: $RESULTS"
          [ "$CHANGES" = success ] || { echo "::error::The change detection did not succeed."; exit 1; }
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A test job ended as $r."; exit 1 ;; esac
          done

  # Deploy to live: only on main and only if the tests passed. Cloudflare keys are in the repo's
  # Secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID); without them the job warns and skips.
  deploy:
    needs: [changes, test]
    # Docs-only pushes to main deploy nothing (the test jobs were skipped). A status function is needed (CI2): without one
    # the `if` gets an implicit `success()`, which looks at every job up the chain, and a push skips e2e / site / games,
    # so the deploy was skipped too. `!cancelled()` (not `always()`) keeps a cancelled run from deploying; the explicit
    # `needs.test.result` keeps "deploy only when the tests passed".
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.changes.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # 25, not 15: the live e2e alone took 13.6 min on 0.9.97.76 (ghost.mjs waits 90 s of silence per game, drop.mjs
    # 130 s), so one file's retry pushed 0.9.97.77's job past 15 min and it was cancelled before "mark the version live".
    timeout-minutes: 25
    # Security R4-5: the deploy runs in the `production` environment. Its secrets (Cloudflare, YouTube, feedback, usage)
    # can live there instead of the repository, so no other job or branch can read them. Repository secrets still reach
    # it until the owner moves them; GitHub creates the environment on first use if it doesn't exist yet.
    environment: production
    # Card OPS1: `live` is true only when this run deployed and the live e2e passed; the `tag` job reads it.
    outputs:
      live: ${{ steps.live.outputs.ok }}
    # Two quick pushes must not deploy at the same time; the next one waits.
    concurrency:
      group: deploy
      cancel-in-progress: false
    # Secrets live only on the steps that need them (security review 3, R3-2): never in the environment of `npm ci`
    # (install scripts) or the build. This step only says whether the Cloudflare keys exist.
    steps:
      - name: Check keys
        id: keys
        env:
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAVE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAVE_TOKEN" = true ] && [ "$HAVE_ACCOUNT" = true ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are missing, deploy skipped."; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.keys.outputs.ok == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.keys.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        if: steps.keys.outputs.ok == 'true'
        run: |
          npm ci
          npm run build
          # R3-2 guard: no deploy secret may be in this step's environment.
          if env | grep -qE '^(CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|YOUTUBE_API_KEY|FEEDBACK_GITHUB_TOKEN|USAGE_TOKEN|LAB_CODE)='; then
            echo "::error::A deploy secret is in the install / build environment."; exit 1
          fi

      - name: Deploy to Cloudflare
        if: steps.keys.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # YouTube search in the link box (optional): uploaded as a Worker secret with every deploy.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # "Send feedback" (card 9, optional): a fine-grained token, Issues: write on this repository only. Only this
          # step sees it (security review 3 R3-2); it goes to the Worker as a secret like the YouTube key.
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          # Privacy card (0.9.97.60): the PRIVATE repository the feedback issues go to (owner/name), a repository variable
          # (Settings → Secrets and variables → Actions → Variables). Without it feedback answers 'off': this repository
          # is public and a reply address must never become a public issue.
          FEEDBACK_REPO: ${{ vars.FEEDBACK_REPO }}
          # Card Y3 (optional): the owner's key for GET /api/youtube/usage (header X-Usage-Token); without it the route
          # is refused.
          USAGE_TOKEN: ${{ secrets.USAGE_TOKEN }}
          # Card LABLOCK (optional): the owner's code that opens the 🐞 Test Lab on the live site; without it the lab stays
          # shut there (local servers open it without a code).
          LAB_CODE: ${{ secrets.LAB_CODE }}
        run: |
          set -o pipefail
          [ -n "$YOUTUBE_API_KEY" ] || echo "::warning::YOUTUBE_API_KEY is missing, YouTube search stays off."
          [ -n "$FEEDBACK_GITHUB_TOKEN" ] && [ -n "$FEEDBACK_REPO" ] || echo "::warning::FEEDBACK_GITHUB_TOKEN or the FEEDBACK_REPO variable is missing, feedback answers 'off'."
          [ -n "$LAB_CODE" ] || echo "::warning::LAB_CODE is missing, the Test Lab stays shut on the live site."
          if [ -n "$YOUTUBE_API_KEY$FEEDBACK_GITHUB_TOKEN$FEEDBACK_REPO$USAGE_TOKEN$LAB_CODE" ]; then
            # The keys go from the environment into a temporary file outside the repo, never into the log; only the
            # ones that are set (an empty value would overwrite a working secret).
            node -e 'const e = process.env, s = {}; for (const k of ["YOUTUBE_API_KEY", "FEEDBACK_GITHUB_TOKEN", "FEEDBACK_REPO", "USAGE_TOKEN", "LAB_CODE"]) if (e[k]) s[k] = e[k]; require("fs").writeFileSync(process.argv[1], JSON.stringify(s))' "$RUNNER_TEMP/secrets.json"
            npm run deploy -w @swm/server -- --secrets-file "$RUNNER_TEMP/secrets.json" | tee "$RUNNER_TEMP/deploy.log"
            rm -f "$RUNNER_TEMP/secrets.json"
          else
            npm run deploy -w @swm/server | tee "$RUNNER_TEMP/deploy.log"
          fi
          # The new version's id, for the live e2e's wait below.
          echo "SWM_VERSION=$(grep -oE 'Current Version ID: [0-9a-f-]+' "$RUNNER_TEMP/deploy.log" | awk '{print $4}')" >> "$GITHUB_ENV"

      - name: End-to-end tests against live
        if: steps.keys.outputs.ok == 'true'
        env:
          # Card Y3: search.mjs reads the usage counters with the owner's key when it is set.
          USAGE_TOKEN: ${{ secrets.USAGE_TOKEN }}
        run: |
          # The new version takes a minute or two to spread, and objects started on the old code restart later (closing
          # their connections mid-test). Wait until the Worker and a Durable Object both answer with the new id.
          # The address comes from site.config.json (card R3-3).
          SITE="$(node scripts/site-config.mjs origin)"
          if [ -n "$SWM_VERSION" ]; then
            node scripts/wait-live.mjs "$SITE" "$SWM_VERSION"
          else
            echo "::warning::No version id in the deploy output; waiting 30 s instead."
            sleep 30
          fi
          npm run e2e -- "$(node scripts/site-config.mjs ws)"
          # Card R3-3: the main address and every alias answer, og:image and /domain.js name the main address.
          node scripts/check-domain.mjs --live

      - name: Mark the version live
        id: live
        if: steps.keys.outputs.ok == 'true'
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  # Card OPS1 / TAG1: every version that went live gets a tag `v<version>` (the extension's version, the same number as
  # the site's footer), made by scripts/tag-live.mjs: this run's version at this run's commit, plus a catch-up for an
  # earlier live version that has no tag yet. The only job that may write to the repository, and only tags:
  # `contents: write` lives here alone (security R4-5), `actions: read` lets it see which commits deployed, and there is
  # no `workflows` permission on purpose: a tag the token may not make (main's workflow files changed since that commit)
  # becomes a warning with the owner's steps, never a red run. A version deployed again keeps its first tag.
  tag:
    needs: deploy
    # !cancelled() for the same reason as deploy's: skipped test jobs up the chain must not skip the tag.
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.deploy.outputs.live == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag the live versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/tag-live.mjs
