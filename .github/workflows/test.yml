# On every push and PR: typecheck, unit tests, build and end-to-end tests against a local server.
# The local server is `wrangler dev` (no account needed); e2e connects fake users to the real server code.
# On every push to main, if the tests pass, site + server are deployed to Cloudflare and e2e runs against
# live (deploy job). Can also be started by hand from the Actions tab ("Run workflow").
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: the jobs only check out the code; deploys use the Cloudflare token (security review 2, L10).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Name check (Sidelit)
        run: node scripts/check-name.mjs

      - name: Unit tests
        run: npm test

      - name: Build (extension + site)
        run: npm run build

      - name: Room page size budget
        run: node scripts/size-budget.mjs

      - name: Start local server
        working-directory: apps/server
        run: |
          npx wrangler dev --port 8787 > ../../wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8787/ > /dev/null; then echo "server ready"; exit 0; fi
            sleep 1
          done
          echo "server did not start"; cat ../../wrangler.log; exit 1

      - name: End-to-end tests
        run: npm run e2e

      # Card A11y: axe-core (WCAG 2.1 A + AA) on home, help, join, room, settings, invite, games hall, tic-tac-toe and
      # the first tips, plus a keyboard tour. axe-core and Playwright are installed for this step only (not site deps).
      - name: Accessibility (axe + keyboard tour)
        run: |
          npm i --no-save --no-audit --no-fund axe-core@4.10.2 playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/harness/a11y/run.cjs http://localhost:8787

      # Card DL: the 🐞 Test Lab (drawer, command box, status, log, bug text) and that with it off nothing of it loads.
      - name: Test Lab
        run: |
          node scripts/harness/test-lab/run.cjs http://localhost:8787
          node scripts/harness/lab-friends/run.cjs http://localhost:8787

      - name: Server log (on failure)
        if: failure()
        run: cat wrangler.log || true

  # Deploy to live: only on main and only if the tests passed. Cloudflare keys are in the repo's
  # Secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID); without them the job warns and skips.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two quick pushes must not deploy at the same time; the next one waits.
    concurrency:
      group: deploy
      cancel-in-progress: false
    # Secrets live only on the steps that need them (security review 3, R3-2): never in the environment of `npm ci`
    # (install scripts) or the build. This step only says whether the Cloudflare keys exist.
    steps:
      - name: Check keys
        id: keys
        env:
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAVE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAVE_TOKEN" = true ] && [ "$HAVE_ACCOUNT" = true ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are missing, deploy skipped."; fi

      - uses: actions/checkout@v7
        if: steps.keys.outputs.ok == 'true'

      - uses: actions/setup-node@v7
        if: steps.keys.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        if: steps.keys.outputs.ok == 'true'
        run: |
          npm ci
          npm run build
          # R3-2 guard: no deploy secret may be in this step's environment.
          if env | grep -qE '^(CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|YOUTUBE_API_KEY|FEEDBACK_GITHUB_TOKEN|USAGE_TOKEN)='; then
            echo "::error::A deploy secret is in the install / build environment."; exit 1
          fi

      - name: Deploy to Cloudflare
        if: steps.keys.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # YouTube search in the link box (optional): uploaded as a Worker secret with every deploy.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # "Send feedback" (card 9, optional): a fine-grained token, Issues: write on this repository only. Only this
          # step sees it (security review 3 R3-2); it goes to the Worker as a secret like the YouTube key.
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          # Card Y3 (optional): the owner's key for GET /api/youtube/usage (header X-Usage-Token); without it the route
          # is refused.
          USAGE_TOKEN: ${{ secrets.USAGE_TOKEN }}
        run: |
          set -o pipefail
          [ -n "$YOUTUBE_API_KEY" ] || echo "::warning::YOUTUBE_API_KEY is missing, YouTube search stays off."
          [ -n "$FEEDBACK_GITHUB_TOKEN" ] || echo "::warning::FEEDBACK_GITHUB_TOKEN is missing, feedback answers 'off'."
          if [ -n "$YOUTUBE_API_KEY$FEEDBACK_GITHUB_TOKEN$USAGE_TOKEN" ]; then
            # The keys go from the environment into a temporary file outside the repo, never into the log; only the
            # ones that are set (an empty value would overwrite a working secret).
            node -e 'const e = process.env, s = {}; for (const k of ["YOUTUBE_API_KEY", "FEEDBACK_GITHUB_TOKEN", "USAGE_TOKEN"]) if (e[k]) s[k] = e[k]; require("fs").writeFileSync(process.argv[1], JSON.stringify(s))' "$RUNNER_TEMP/secrets.json"
            npm run deploy -w @swm/server -- --secrets-file "$RUNNER_TEMP/secrets.json" | tee "$RUNNER_TEMP/deploy.log"
            rm -f "$RUNNER_TEMP/secrets.json"
          else
            npm run deploy -w @swm/server | tee "$RUNNER_TEMP/deploy.log"
          fi
          # The new version's id, for the live e2e's wait below.
          echo "SWM_VERSION=$(grep -oE 'Current Version ID: [0-9a-f-]+' "$RUNNER_TEMP/deploy.log" | awk '{print $4}')" >> "$GITHUB_ENV"

      - name: End-to-end tests against live
        if: steps.keys.outputs.ok == 'true'
        env:
          # Card Y3: search.mjs reads the usage counters with the owner's key when it is set.
          USAGE_TOKEN: ${{ secrets.USAGE_TOKEN }}
        run: |
          # The new version takes a minute or two to spread, and objects started on the old code restart later (closing
          # their connections mid-test). Wait until the Worker and a Durable Object both answer with the new id.
          if [ -n "$SWM_VERSION" ]; then
            node scripts/wait-live.mjs https://screen-with-me.swm-server.workers.dev "$SWM_VERSION"
          else
            echo "::warning::No version id in the deploy output; waiting 30 s instead."
            sleep 30
          fi
          npm run e2e -- wss://screen-with-me.swm-server.workers.dev
